name = "oor-family-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
[observability]
enabled = false
[[durable_objects.bindings]]
name = "PAIRS"
class_name = "FamilyPair"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyPair"]
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "21001"
simple = { limit = 5, period = 60 }
[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "21002"
simple = { limit = 60, period = 60 }
