name: Voice Notes preview (no publication)
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "voicenotes/**"
      - ".github/workflows/voicenotes-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voicenotes-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test and compile preview
        run: gradle :voicenotes:testDebugUnitTest :voicenotes:lintDebug :voicenotes:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: voice-notes-preview
          path: voicenotes/build/outputs/apk/debug/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-notes-test-reports
          path: voicenotes/build/reports/
          retention-days: 14
