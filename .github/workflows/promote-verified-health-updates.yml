name: Publish authorized Voice Notes and Live Guard exact tested bytes
on:
  push:
    branches: ["arena/e24330d5-rp-android-apps"]
    paths:
      - "docs/approved-health-candidates.json"
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-exact-health-updates-2026-11-01
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Signing, security and release provenance policy
        run: |
          python3 tools/verify_release_signing_policy.py --fresh-install
          python3 -m py_compile tools/promote_verified_health_updates.py
      - name: Promote only the two pinned exact tested APKs, preserve old releases
        run: python3 tools/promote_verified_health_updates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-exact-publication-receipts
          path: ${{ runner.temp }}/health-publication-receipts.json
          retention-days: 30
          if-no-files-found: warn
