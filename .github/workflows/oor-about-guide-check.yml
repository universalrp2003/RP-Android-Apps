name: Oor About and bilingual guide source correction (no publication)
on:
  push:
    branches: ["arena/e6ccb9f0-rp-android-apps"]
    paths:
      - "oorarivippu/src/**"
      - "shared/src/main/java/com/universalrp/updates/AppGuides.kt"
      - "tools/verify_apps_localization.py"
      - "tools/tests/test_oor_about_guide.py"
      - ".github/workflows/oor-about-guide-check.yml"
permissions:
  contents: read
concurrency:
  group: oor-about-guide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Source, bilingual and non-publication contracts
        run: |
          python3 -m unittest discover -s tools/tests -q
          python3 tools/verify_apps_localization.py
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile Oor and run actual guide and existing unit tests, no APK assembly
        run: ./gradlew :oorarivippu:compileReleaseKotlin :oorarivippu:testReleaseUnitTest :oorarivippu:lintRelease --stacktrace
      - name: Verify required guide tests ran and explicitly account for the separate opt-in speech probe
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          roots=[E.parse(p).getroot() for p in Path('oorarivippu/build/test-results/testReleaseUnitTest').glob('TEST-*.xml')]
          assert roots, 'No unit test results'
          guide=[r for r in roots if r.get('name')=='com.oorarivippu.voiceannouncer.OorAboutGuideTest']
          assert len(guide)==1 and int(guide[0].get('tests','0'))==4
          allowed_skip=('com.oorarivippu.voiceannouncer.NeuralCloudVoiceEngineTest', 'livePlaceAnnouncementSynthesisWorksForTamilAndEnglishStudioVoices')
          skipped=[]
          for r in roots:
              for field in ('failures','errors'): assert int(r.get(field,'0'))==0, (r.get('name'),field)
              for c in r.iter('testcase'):
                  if c.find('skipped') is not None:
                      identity=(c.get('classname'),c.get('name'))
                      assert identity==allowed_skip, ('Unexpected skipped test',identity)
                      skipped.append(identity)
          assert int(guide[0].get('skipped','0'))==0, 'A required new guide test was skipped'
          assert len(skipped)<=1
          total=sum(int(r.get('tests','0')) for r in roots)
          print(f'::notice title=Oor About and Guide source verification::Compiled Oor and passed {total-len(skipped)} unit tests, including all 4 required About/Guide tests; no failures or unexpected skips. Separately accounted for {len(skipped)} pre-existing opt-in external live-speech probe, not run in this source-only task. No APK assembled or published; installed 1.1.15 unchanged.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oor-about-guide-test-and-lint-reports-only
          path: |
            oorarivippu/build/test-results/testReleaseUnitTest/
            oorarivippu/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
