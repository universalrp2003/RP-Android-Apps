name: Publish verified Tamilan Store 0.16
on:
  push:
    branches: ["arena/c1856bf9-rp-android-apps"]
    paths: ["docs/approved-tamilan-store-0.16.json"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-tamilan-store-0-16
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/arena/c1856bf9-rp-android-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified APK without rebuilding
        run: python3 tools/promote_tamilan_store_0_16.py
