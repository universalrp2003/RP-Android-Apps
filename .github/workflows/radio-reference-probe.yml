name: Radio reference candidate probe (no publication)
on:
  workflow_dispatch:
  push:
    branches: ["arena/30198928-rp-android-apps"]
    paths: ["tools/radio_reference/candidates-twelfth.json", "tools/radio_reference/probe_candidates.py", ".github/workflows/radio-reference-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install FFprobe if needed
        run: |
          if ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffprobe
      - name: Probe selected reference candidates
        run: python3 tools/radio_reference/probe_candidates.py tools/radio_reference/candidates-twelfth.json "$RUNNER_TEMP/reference-probe"
      - uses: actions/upload-artifact@v4
        with:
          name: radio-reference-probe-twelfth
          retention-days: 14
          path: ${{ runner.temp }}/reference-probe/reference-probe.json
      - name: Expose probe receipt as a blob (no branch or release write)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import base64, json, os, pathlib, subprocess
          data = (pathlib.Path(os.environ['RUNNER_TEMP'])/'reference-probe'/'reference-probe.json').read_bytes()
          payload = json.dumps({'content':base64.b64encode(data).decode(), 'encoding':'base64'})
          result = subprocess.run(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'], input=payload, text=True, capture_output=True, check=True)
          print('::notice title=Reference twelfth probe receipt::blob='+json.loads(result.stdout)['sha'])
