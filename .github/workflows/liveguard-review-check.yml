name: Live Guard review fixes verification (no publication)
on:
  push:
    branches: ["arena/30198928-rp-android-apps"]
    paths:
      - "cleaner/**"
      - "shared/src/main/java/com/universalrp/voice/**"
      - "shared/src/main/java/com/universalrp/weather/**"
      - ".github/workflows/liveguard-review-check.yml"
permissions:
  contents: read
concurrency:
  group: liveguard-review-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Source and localization checks
        run: |
          python3 tools/verify_cleaner_localization.py
          python3 tools/verify_cleaner_core_manifest.py
          python3 -m unittest discover -s tools/tests -q
      - name: Compile and run Android-simulation tests
        run: |
          set -o pipefail
          gradle :cleaner:testReleaseUnitTest :cleaner:lintRelease :cleaner:assembleDebug :radio:compileDebugKotlin :oorarivippu:compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee /tmp/liveguard-review-build.log
      - name: Surface errors
        if: failure()
        run: |
          python3 tools/report_failing_tests.py || true
          test ! -f /tmp/liveguard-review-build.log || grep -E '^e: |^e: file:|Error:| FAILED|What went wrong' -A 5 /tmp/liveguard-review-build.log | tail -150 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liveguard-review-test-evidence
          path: |
            /tmp/liveguard-review-build.log
            cleaner/build/test-results/
            cleaner/build/reports/lint-results-*.xml
          retention-days: 7
          if-no-files-found: ignore
