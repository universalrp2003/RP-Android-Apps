name: Provision isolated owner-authorized Oor family test service
on:
  push:
    branches: ["arena/d4f4c9b6-rp-android-apps"]
    paths: ["docs/oor-family-service-deployment-pins.json"]
permissions:
  contents: read
  actions: read
concurrency:
  group: provision-oor-family-service
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: oorarivippu/family-relay
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Verify owner authorization and completed candidate source
        working-directory: .
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path('docs/oor-family-service-deployment-pins.json').read_text())
          assert p['authorized'] is True and p['town_only'] is True and p['encrypted_latest_max_minutes']==15
          assert p['worker_name']=='oor-family-relay' and p['change_secret_message'] is False and p['paid_upgrade_authorized'] is False
          subprocess.run(['git','merge-base','--is-ancestor',p['source'],'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',p['source'],'HEAD','--','oorarivippu/family-relay/','.github/workflows/oor-family-candidate.yml'],check=True)
          r=json.loads(subprocess.check_output(['gh','api',f'repos/{p["repository"]}/actions/runs/{p["candidate_run"]}'],text=True))
          assert (r['head_sha'],r['head_branch'],r['path'],r['conclusion'])==(p['source'],'arena/d4f4c9b6-rp-android-apps','.github/workflows/oor-family-candidate.yml','success')
          PY
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund && npm test
      - name: Refuse to overwrite any existing worker or change account subscriptions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token=(process.env.CLOUDFLARE_API_TOKEN??'').trim();if(!token)throw new Error('Existing GitHub Cloudflare secret needs attention; no deployment');
          const headers={Authorization:`Bearer ${token}`};
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts',{headers});
          const accounts=await response.json();
          if(!response.ok || !accounts.success || accounts.result.length!==1)throw new Error('Cloudflare account lookup was not unambiguous; no deployment');
          const check=await fetch(`https://api.cloudflare.com/client/v4/accounts/${accounts.result[0].id}/workers/scripts/oor-family-relay`,{headers});
          if(check.status!==404)throw new Error('Could not prove worker name unused; refusing overwrite');
          console.log('PASS: separate worker name unused; no existing service or account plan will be changed');
          JS
      - name: Deploy separate test service using existing account secret
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          unset CLOUDFLARE_ACCOUNT_ID
          if ! npx wrangler deploy > "$RUNNER_TEMP/oor-family-deploy.log" 2>&1; then
            echo "::error::Separate Oor test service deployment failed; no APK release or subscription change."
            grep -E 'ERROR|error' "$RUNNER_TEMP/oor-family-deploy.log" | head -n 8 | sed -E 's/[0-9a-f]{32}/<id>/g' || true
            exit 1
          fi
          url="$(grep -oE 'https://oor-family-relay\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/oor-family-deploy.log" | head -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Synthetic two-device HTTPS test and cleanup, no family data
        env:
          FAMILY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node test/http-smoke.mjs "$FAMILY_URL"
          echo "::notice title=Oor family verified test service::$FAMILY_URL"
