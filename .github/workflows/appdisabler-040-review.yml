name: System App Disabler 0.4 review candidate (no publication)
on:
  push:
    branches: ["arena/eb6de80e-rp-android-apps"]
    paths: ["appdisabler/**", ".github/workflows/appdisabler-040-review.yml"]
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: ./.github/actions/prepare-release-signing
        with:
          keystore-base64: ${{ secrets.RP_RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Unit tests, lint and signed release candidate
        run: ./gradlew :appdisabler:testReleaseUnitTest :appdisabler:lintRelease :appdisabler:assembleRelease --no-daemon --stacktrace
      - name: Verify release identity and stable signer
        run: |
          set -euo pipefail
          trap 'echo "::error title=APK verification failed::Line $LINENO; $(cat "$RUNNER_TEMP/badging.txt" 2>/dev/null | head -1)"' ERR
          mapfile -t APKS < <(find appdisabler/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f)
          [[ ${#APKS[@]} == 1 ]]
          APK="${APKS[0]}"
          cp "$APK" "$RUNNER_TEMP/appdisabler-0.4.0.apk"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.universalrp.appdisabler' versionCode='4' versionName='0.4.0'" "$RUNNER_TEMP/badging.txt"
          ! grep -q application-debuggable "$RUNNER_TEMP/badging.txt"
          "$TOOLS/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/signer.txt"
          grep -F '7366d76dc5a9032424f032f1530f661366d880af37657374df85ca7a6299747d' "$RUNNER_TEMP/signer.txt"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: appdisabler-0.4.0-review-candidate
          path: ${{ runner.temp }}/appdisabler-0.4.0.apk
          retention-days: 14
