name: Secret handoff UI against verified unchanged native APK
on:
  push:
    branches: ["arena/6d87e1ec-rp-android-apps"]
    paths:
      - ".github/workflows/secret-handoff-ui-check.yml"
      - "secretmessage/wifi-test/run-wifi-test-on-emulator.sh"
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[check-secret-handoff-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require completed native, deterministic and signing gates for pinned artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/runs/40672116337 > /tmp/native-run.json
          gh api repos/${{ github.repository }}/actions/runs/40672116337/jobs > /tmp/native-jobs.json
          gh api repos/${{ github.repository }}/actions/artifacts/12809501243 > /tmp/native-artifact.json
          python3 - <<'PY'
          import json
          run = json.load(open('/tmp/native-run.json'))
          assert run['head_sha'] == '850674f32ba77c3397fd045784f3806edf7dbeec'
          assert run['path'] == '.github/workflows/secret-message-wifi-test.yml'
          jobs = json.load(open('/tmp/native-jobs.json'))['jobs']
          job, = [j for j in jobs if j['name'] == 'Build, check and sign Secret Message']
          steps = {s['name']: s['conclusion'] for s in job['steps']}
          for gate in ['Run unit tests and compile the app before the native build', 'Build the JNI library for four ABIs, the debug APK and the unsigned release APK', 'Sign the release APK with the project key and check it']:
              assert steps[gate] == 'success', gate
          # Old smoke failed only because it demanded the deliberately retired installer UI.
          # This job tests the replacement UI against exactly those same signed APK bytes.
          artifact = json.load(open('/tmp/native-artifact.json'))
          assert artifact['id'] == 12809501243 and not artifact['expired']
          assert artifact['name'] == 'secretmessage-release-apk-273'
          assert artifact['workflow_run']['id'] == 40672116337
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40672116337
          artifact-ids: '12809501243'
          merge-multiple: true
          path: verified-native
      - name: Verify unchanged bytes and signing identity, then exercise real API35 UI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find verified-native -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          test "$(basename "$apk")" = Secret-Message-v1.1.3.apk
          test "$(stat -c %s "$apk")" = 29493073
          test "$(sha256sum "$apk" | cut -d ' ' -f1)" = cbc5f04abf97e2a260d0c486450107b32d93980f5351b31615d4e756c9233efa
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk" > /tmp/native-signature
          signer="$(sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' /tmp/native-signature | tr -d ' :\r' | tr A-F a-f | sort -u)"
          test "$signer" = 58e370e417cf6f33234689acd5bf379474f5a8c55f79181d9e892a321bc04f08
          "$tools/aapt" dump badging "$apk" > /tmp/native-badging
          grep -Fq "package: name='com.rpideas.secretmessage' versionCode='5' versionName='1.1.3'" /tmp/native-badging
          "$tools/aapt" dump permissions "$apk" > /tmp/native-permissions
          if grep -Eq 'android.permission.(REQUEST_INSTALL_PACKAGES|INSTALL_PACKAGES)' /tmp/native-permissions; then exit 1; fi
          bash secretmessage/wifi-test/run-wifi-test-on-emulator.sh "$apk"
          echo '::notice title=Secret handoff UI verified::Same signed APK from source850674f, four native ABIs; real API35 relay, local-host, identity, settings and metadata/browser UI smoke passed. Not a new publication or two-phone/device/security certification.'
