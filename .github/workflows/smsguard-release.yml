name: SMS Guard stable release

# Strictly dormant during testing: publishes ONLY when a commit explicitly contains [publish-smsguard]
# or manual workflow_dispatch is invoked after owner approval.
on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/oorarivippu-release.yml"
      - ".github/workflows/oorarivippu-test-apk.yml"
      - ".github/workflows/smsguard-test-apk.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified SMS Guard APK after owner phone sign-off"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: smsguard-stable-release
  cancel-in-progress: false

jobs:
  build-verify-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-smsguard]') }}
    name: Test, sign, verify, and publish SMS Guard
    runs-on: ubuntu-latest
    env:
      PUBLISH_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-smsguard]')) }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify bilingual UI and About links
        run: python3 tools/verify_apps_localization.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests, release lint & assemble signed release APK
        run: >-
          ./gradlew --no-daemon --stacktrace
          :smsguard:testReleaseUnitTest
          :smsguard:lintRelease
          :smsguard:assembleRelease

      - name: Publish verified GitHub Release asset when authorized
        if: ${{ env.PUBLISH_REQUESTED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RP_ANDROID_APPS_RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="1.0.4"
          tag="sms-guard-v${version}"
          asset="SMS-Guard-v${version}.apk"
          mapfile -t built_apks < <(find smsguard/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          cp "${built_apks[0]}" "$RUNNER_TEMP/$asset"
          sha256="$(sha256sum "$RUNNER_TEMP/$asset" | cut -d ' ' -f 1)"
          gh release create "$tag" "$RUNNER_TEMP/$asset" \
            --repo universalrp2003/RP-Android-Apps \
            --title "SMS Guard (குறுஞ்செய்தி காவலன்) v${version}" \
            --notes "Official verified RP Ideas release of SMS Guard (குறுஞ்செய்தி காவலன்) v${version}. SHA-256: \`${sha256}\`"
