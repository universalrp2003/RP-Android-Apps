name: SMS Guard stable release

# Publishes ONLY when a commit explicitly contains [publish-smsguard]
# or manual workflow_dispatch is invoked after owner approval.
on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/oorarivippu-release.yml"
      - ".github/workflows/oorarivippu-test-apk.yml"
      - ".github/workflows/smsguard-test-apk.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified SMS Guard APK after owner phone sign-off"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: smsguard-stable-release
  cancel-in-progress: false

jobs:
  build-verify-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-smsguard]') }}
    name: Test, sign, verify, and publish SMS Guard
    runs-on: ubuntu-latest
    env:
      PUBLISH_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-smsguard]') }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify bilingual UI and About links
        run: python3 tools/verify_apps_localization.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests (including live Neural Cloud TTS verification), release lint & assemble signed release APK
        run: >-
          ./gradlew --no-daemon --stacktrace
          :smsguard:testReleaseUnitTest
          :smsguard:lintRelease
          :smsguard:assembleRelease

      - name: Verify signed APK, publish GitHub Release & confirm live asset SHA-256
        if: ${{ env.PUBLISH_REQUESTED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RP_ANDROID_APPS_RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="1.1.0"
          expected_code="6"
          expected_package="com.universalrp.smsguard"
          expected_signer="9e30f4eab8afce5e4ab444ff9578fec354d6d1414d245253590a9703d5985d55"
          tag="sms-guard-v${version}"
          asset="SMS-Guard-v${version}.apk"

          mapfile -t built_apks < <(find smsguard/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [[ "${#built_apks[@]}" -ne 1 ]]; then
            echo "::error::Expected one signed SMS Guard APK, found ${#built_apks[@]}"
            exit 1
          fi

          apk="$RUNNER_TEMP/$asset"
          cp "${built_apks[0]}" "$apk"
          size="$(stat -c '%s' "$apk")"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          aapt="$build_tools/aapt"
          apksigner="$build_tools/apksigner"

          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='${expected_package}' versionCode='${expected_code}' versionName='${version}'" "$RUNNER_TEMP/badging.txt"
          if grep -q "application-debuggable" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::Signed APK must not be debuggable."
            exit 1
          fi

          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/sig.txt"
          signer="$(sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/sig.txt" | tr -d ' :\r' | tr 'A-F' 'a-f' | sort -u)"
          if [[ "$signer" != "$expected_signer" ]]; then
            echo "::error::Unexpected signing certificate: $signer"
            exit 1
          fi

          sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"

          blob_sha="$(python3 - "$apk" <<'PY'
          import base64, json, os, sys, urllib.request
          with open(sys.argv[1], "rb") as f:
              b64 = base64.b64encode(f.read()).decode("ascii")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=json.dumps({"content": b64, "encoding": "base64"}).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              print(json.loads(resp.read())["sha"])
          PY
          )"

          cat <<EOF > "$RUNNER_TEMP/notes.md"
          ## SMS Guard (குறுஞ்செய்தி காவலன்) v${version} — Official Release

          **Package:** \`${expected_package}\` · **Version:** \`${version}\` (\`versionCode = ${expected_code}\`) · **Minimum Android:** Android 8.0+ (API 26)
          **Asset:** \`${asset}\` (\`${size}\` bytes)
          **SHA-256:** \`${sha256}\`

          ### Key Features
          - **Cyber Link Security Scanner (Online + NextDNS Compatible + Offline Honest Queue):** Blocks malicious \`.apk\` downloads, phishing lookalikes, and scam short-links with a red shield while marking verified official links green.
          - **6 Studio Online Neural Voices (3 Male + 3 Female) & Daily Auto Male ↔ Female Rotation:** Speaks bank, security, and wake-up summaries in crisp human-like Tamil & English voices online first, automatically alternating Male and Female day by day and seamlessly falling back to your phone's installed System TTS voice offline.
          - **100% OTP Silence & Zero Account Digits Readout:** Never reads OTP codes or bank account digits aloud; provides one-tap **Copy OTP**.
          - **Spoof-Proof Bank, Card, UPI & FASTag Finance Ledger + Biometric Lock:** Separates Bank/UPI/Card spend from FASTag toll deductions, blocks fake \`+91\` payment spoofs, and locks behind fingerprint/screen lock or custom PIN.
          - **Sleep Time Quiet Schedule & Sequential Wake Readout:** Stays quiet during sleep hours and reads queued bank alerts one by one upon waking.
          - **Verified on Physical Devices:** Tested on Samsung Galaxy M32 (Dual-SIM large inbox), Xiaomi Redmi 13 5G (with NextDNS), and OPPO A3s, scanned clean by Google Play Protect (*"This app looks safe"*).
          EOF

          gh release create "$tag" "$apk" \
            --repo universalrp2003/RP-Android-Apps \
            --title "SMS Guard (குறுஞ்செய்தி காவலன்) v${version}" \
            --notes-file "$RUNNER_TEMP/notes.md"

          echo "::notice::asset=${asset} bytes=${size} sha256=${sha256} blob_sha=${blob_sha} signer=${signer}"
