name: Live Studio Voice Check

# 2.72 / C1 - the live-network voice suite, run on a schedule instead of as a build gate.
#
# LiveStudioVoiceSynthesisTest really calls the Edge TTS service for all 10 Studio profiles in
# Tamil and English. It used to run inside every build, which is what turned `main` red on
# 25 October 2026 and blocked a release that had nothing to do with voice.
#
# A live network probe is monitoring, not correctness: no unit test can prove an external service
# is up, and a red build cannot bring it back. So it runs here, weekly and on demand, and it never
# gates a release. The task itself is `ignoreFailures = true` for the same reason.

on:
  schedule:
    # 03:17 UTC every Sunday - an odd minute so it does not queue behind the hourly jobs.
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-voice-check
  cancel-in-progress: false

jobs:
  live-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # The one task that talks to the network. Never gates anything.
      - name: Run the live studio voice suite
        run: ./gradlew :cleaner:testLiveStudioVoice --no-daemon --continue

      - name: Report
        if: always()
        run: |
          echo "Live studio voice check finished."
          echo "This workflow is monitoring only and never gates a build or a release."
          echo "Results: cleaner/build/reports/tests/testLiveStudioVoice/"
          if ls cleaner/build/test-results/testLiveStudioVoice/*.xml >/dev/null 2>&1; then
            grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
              cleaner/build/test-results/testLiveStudioVoice/*.xml || true
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-studio-voice-results
          path: |
            cleaner/build/reports/tests/testLiveStudioVoice/
            cleaner/build/test-results/testLiveStudioVoice/
          if-no-files-found: warn
          retention-days: 14
