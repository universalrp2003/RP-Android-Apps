name: SMS live voice probe (monitoring only)
# Dispatch may be unavailable to the integration. An explicit branch commit marker
# permits a real external-service probe without publishing or weakening the assertion.
on:
  push:
    branches: ["arena/6d87e1ec-rp-android-apps"]
    paths: [".github/workflows/sms-live-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[check-live-voice]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run actual SMS external synthesis assertion
        run: gradle :smsguard:testLiveSmsVoice --no-daemon --stacktrace
      - name: Preserve live and deterministic results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sms-live-probe-results
          path: |
            smsguard/build/test-results/
            smsguard/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
