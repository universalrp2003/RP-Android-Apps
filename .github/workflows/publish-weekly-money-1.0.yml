name: Publish verified Weekly Money 1.0
on:
  push:
    branches: ["arena/1e9cafce-rp-android-apps"]
    paths: ["docs/approved-weekly-money-1.0.json"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/arena/1e9cafce-rp-android-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Promote the exact verified release APK
        run: python3 tools/promote_weekly_money_1_0.py
