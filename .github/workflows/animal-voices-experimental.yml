name: Animal Voices experimental Android test (no publication)
on:
  push:
    branches: ["arena/b0b465b9-rp-android-apps"]
    paths: ["animalvoice/app/**", "animalvoice/run-emulator-checks.sh", "settings.gradle.kts", ".github/workflows/animal-voices-experimental.yml"]
permissions: {contents: read}
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Verify model and compile isolated prototype
        run: |
          set -o pipefail
          echo '10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de  animalvoice/app/src/main/assets/yamnet.tflite' | sha256sum -c
          ./gradlew :animalvoice:testDebugUnitTest :animalvoice:lintDebug :animalvoice:assembleDebug :animalvoice:assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/animal-build.log"
      - name: Verify APK identity and permissions
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk="$(find animalvoice/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "Found APK: $apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/animal-badging.txt"
          cat "$RUNNER_TEMP/animal-badging.txt"
          grep -F "name='com.universalrp.animalvoice.experimental'" "$RUNNER_TEMP/animal-badging.txt"
          grep -F "versionCode='16'" "$RUNNER_TEMP/animal-badging.txt"
          grep -F "versionName='0.16-experimental'" "$RUNNER_TEMP/animal-badging.txt"
          grep -F "uses-permission: name='android.permission.RECORD_AUDIO'" "$RUNNER_TEMP/animal-badging.txt"
          grep -F "uses-permission: name='android.permission.INTERNET'" "$RUNNER_TEMP/animal-badging.txt"
          grep -F "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'" "$RUNNER_TEMP/animal-badging.txt"
          ! grep -E "uses-permission: name='android.permission.(READ_PHONE_STATE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)'" "$RUNNER_TEMP/animal-badging.txt"
      - name: Fetch exact BirdNET model for non-commercial test only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' repos/birdnet-team/BirdNET-Lite/git/blobs/cff805384fae5e980c5294a1f3b7530eef042332 > "$RUNNER_TEMP/birdnet.tflite"
          echo "f073d0aa626b4a5bb0705982d06de74c562f041ba76ebada18bc3e29126f6755  $RUNNER_TEMP/birdnet.tflite" | sha256sum -c
      - run: sudo chmod a+rw /dev/kvm
      - name: Run synthetic native model and permission checks (no animal recordings)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: bash animalvoice/run-emulator-checks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: animal-voices-experimental-debug
          path: animalvoice/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Surface bounded build or native failures
        if: failure()
        shell: python
        run: |
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])
          for p in (r/'animal-build.log',r/'animal-native.txt',r/'animal-setup.txt',r/'animal-badging.txt'):
              if p.exists():
                  lines=p.read_text(errors='replace').splitlines()
                  selected=lines if p.name.endswith('native.txt') or p.name.endswith('setup.txt') or p.name.endswith('badging.txt') else [x for x in lines if any(y in x for y in ('e: file:', 'FAILURE:', 'error:', 'Exception', 'What went wrong'))]
                  msg=(p.name+'\n'+'\n'.join(selected or lines[-20:]))[-8000:]
                  print('::error title=Animal Voices check::'+msg.replace('%','%25').replace('\n','%0A'))
