name: Store system-owned screen-off download regression (no publication)
on:
  push:
    branches: ["arena/**"]
    paths: ["tamilanstore/**", ".github/workflows/store-background-download.yml"]
permissions:
  contents: read
concurrency:
  group: store-background-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Compile native screen-off regression and run unit tests
        run: gradle :tamilanstore:testDebugUnitTest :tamilanstore:lintDebug :tamilanstore:assembleDebug :tamilanstore:assembleDebugAndroidTest --no-daemon --stacktrace
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: |
            adb install -r tamilanstore/build/outputs/apk/debug/tamilanstore-debug.apk
            adb install -r tamilanstore/build/outputs/apk/androidTest/debug/tamilanstore-debug-androidTest.apk
            mkdir -p background-results
            adb shell am instrument -w -r -e class com.universalrp.tamilanstore.BackgroundDownloadTest com.universalrp.tamilanstore.test/androidx.test.runner.AndroidJUnitRunner > background-results/native.txt
            cat background-results/native.txt
            grep -F 'OK (3 tests)' background-results/native.txt
            grep -F 'INSTRUMENTATION_CODE: -1' background-results/native.txt
            adb shell am instrument -w -r -e class com.universalrp.tamilanstore.CatalogRefreshRecoveryTest com.universalrp.tamilanstore.test/androidx.test.runner.AndroidJUnitRunner > background-results/refresh.txt
            cat background-results/refresh.txt
            grep -F 'OK (1 test)' background-results/refresh.txt
            grep -F 'INSTRUMENTATION_CODE: -1' background-results/refresh.txt
      - name: Bounded actual native failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('background-results/native.txt')
          if p.exists(): print('::error title=Store screen-off regression::'+p.read_text()[-10000:].replace('%','%25').replace('\n','%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-screen-off-native-results
          path: background-results/
          retention-days: 7
