name: SMS Guard security candidate (compile only, no publication)

# Owner-requested device-test APK. Does NOT replace the full test/release gate.
on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/smsguard-security-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smsguard-security-candidate
  cancel-in-progress: true

jobs:
  build-signed-test-apk:
    name: Compile, lint, sign and verify device-test candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run repository static & bilingual localization gates
        run: |
          python3 tools/verify_cleaner_localization.py
          python3 tools/verify_apps_localization.py
          python3 tools/verify_cleaner_core_manifest.py
          python3 tools/verify_cleaner_next_update_source.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compile, release lint and assemble (unit/live tests NOT run)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :smsguard:lintRelease \
            :smsguard:assembleRelease 2>&1 | tee smsguard-build.log

      - name: Surface failure diagnostics if build/lint fails
        if: failure()
        shell: bash
        run: |
          python3 tools/report_failing_tests.py | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          {
            grep -E "^e: |FAILED$|AssertionError" smsguard-build.log || true
            for r in smsguard/build/reports/lint-results-*.txt; do
              [ -f "$r" ] && grep -E ": Error:" -A 1 "$r" || true
            done
            grep -B 1 -A 6 "What went wrong:" smsguard-build.log || true
          } | head -n 9 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done || true

      - name: Verify package, ROLE_SMS manifest, RP Ideas signer & SHA-256
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(grep -oP 'versionName\s*=\s*"\K[^"]+' smsguard/build.gradle.kts | head -n1)"
          expected_code="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' smsguard/build.gradle.kts | head -n1)"
          if [[ -z "$expected_version" || -z "$expected_code" ]]; then
            echo "::error::Could not read SMS Guard versionName/versionCode from smsguard/build.gradle.kts"
            exit 1
          fi
          expected_package="com.universalrp.smsguard"
          expected_signer="9e30f4eab8afce5e4ab444ff9578fec354d6d1414d245253590a9703d5985d55"
          asset="SMS-Guard-v${expected_version}.apk"

          mapfile -t built_apks < <(find smsguard/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [[ "${#built_apks[@]}" -ne 1 ]]; then
            echo "::error::Expected one signed SMS Guard APK, found ${#built_apks[@]}"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/smsguard-test"
          apk="$RUNNER_TEMP/smsguard-test/$asset"
          cp "${built_apks[0]}" "$apk"
          size="$(stat -c '%s' "$apk")"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          aapt="$build_tools/aapt"
          apksigner="$build_tools/apksigner"

          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='${expected_package}' versionCode='${expected_code}' versionName='${expected_version}'" "$RUNNER_TEMP/badging.txt"
          if grep -q "application-debuggable" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::Signed APK must not be debuggable."
            exit 1
          fi

          "$aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/manifest-tree.txt"
          grep -Fq "android.provider.Telephony.SMS_DELIVER" "$RUNNER_TEMP/manifest-tree.txt"
          grep -Fq "android.provider.Telephony.WAP_PUSH_DELIVER" "$RUNNER_TEMP/manifest-tree.txt"
          grep -Fq "android.intent.action.RESPOND_VIA_MESSAGE" "$RUNNER_TEMP/manifest-tree.txt"
          grep -Fq "android.permission.SEND_RESPOND_VIA_MESSAGE" "$RUNNER_TEMP/manifest-tree.txt"
          grep -Fq "android.intent.action.SENDTO" "$RUNNER_TEMP/manifest-tree.txt"

          python3 tools/build_fdroid_repo.py \
            --apk "$apk" \
            --out-dir "$RUNNER_TEMP/fdroid/repo" \
            --aapt "$aapt"

          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/sig.txt"
          signer="$(sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/sig.txt" | tr -d ' :\r' | tr 'A-F' 'a-f' | sort -u)"
          if [[ "$signer" != "$expected_signer" ]]; then
            echo "::error::Unexpected signing certificate: $signer"
            exit 1
          fi

          sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          echo "::notice title=Security candidate::asset=$asset bytes=$size sha256=$sha256 signer=$signer; unit/live tests NOT run"
          printf '%s  %s\n' "$sha256" "$asset" > "$RUNNER_TEMP/smsguard-test/SHA256SUMS.txt"
          printf 'Device-test candidate only. Unit/live voice tests NOT run here. Full CI live voice test remains failing. Source: %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/smsguard-test/TEST-STATUS.txt"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "- Unit/live tests: **NOT run by this compile-only workflow; full gate remains separate.**"
            echo "### SMS Guard (குறுஞ்செய்தி காவலன்) Signed Test APK Ready"
            echo "- App: **SMS Guard / குறுஞ்செய்தி காவலன்** (\`com.universalrp.smsguard\`)"
            echo "- Version: \`$expected_version\` (\`versionCode = $expected_code\`)"
            echo "- Asset: \`$asset\` (**$size bytes**)"
            echo "- SHA-256: \`$sha256\`"
            echo "- RP Ideas Signer SHA-256: \`$signer\`"
            echo "- Public GitHub Release: **NOT published** (Test APK only per owner request)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed SMS Guard Test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-guard-security-candidate
          path: ${{ runner.temp }}/smsguard-test/
          if-no-files-found: error
          retention-days: 30
