# RETIRED 2026-11-13. 0.2.0 is published. Do not dispatch this.

# It failed six times with `403 Resource not accessible by integration` on create-release, from a
# step in the same job where the write probe beside it succeeded. The release was instead created
# from the authoring side (which reaches api.github.com) and finished by
# finish-appdisabler-0-2-0.yml (which also reaches uploads.github.com). Kept for the audit trail.
name: Publish owner-tested System App Disabler 0.2.0 (exact tested bytes only)

# 0.2.0 publisher: pinned to candidate run 43410268620 / artifact 14028948231, the exact build the owner tested. It must not fire on ordinary pushes any more: it refuses an
# existing tag by design and every push would otherwise queue a guaranteed failure. Publication of
# a *new* version means editing the pins below and dispatching this workflow by hand.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-exact-appdisabler-0-2-0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # gh requires GH_TOKEN in Actions (without it, every gh call exits 4), and the token it is given
    # carries the `permissions:` block above.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: A/B the failing call against the one that works
        run: |
          set -uo pipefail
          exec > >(tee write-probe.txt) 2>&1
          R="$GH_REPO"; SRC=$(git rev-parse HEAD)
          echo "run=${GITHUB_RUN_ID} sha=$SRC"

          # Both calls are made from this one runner with this one token. The only difference is
          # the arguments, so whichever fails names the argument that matters.
          echo "=== 1. the publisher's exact call ==="
          out=$(gh api -X POST "repos/$R/releases" \
                  -f tag_name="probe-1-${GITHUB_RUN_ID}" \
                  -f "target_commitish=${SRC}" \
                  -f "name=probe" -F draft=true -f "body=probe" 2>&1)
          echo "RESULT_1=${out:0:300}"

          echo "=== 2. the same call without target_commitish/name/body ==="
          out=$(gh api -X POST "repos/$R/releases" -f tag_name="probe-2-${GITHUB_RUN_ID}" -F draft=true 2>&1)
          echo "RESULT_2=${out:0:300}"
          id2=$(printf '%s' "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          [ -n "$id2" ] && gh api -X DELETE "repos/$R/releases/$id2" >/dev/null 2>&1 || true

          echo "=== 3. does a stray draft from a failed call need cleaning? ==="
          gh api "repos/$R/releases?per_page=30" -q '.[] | select(.draft==true) | "\(.id) \(.tag_name)"' 2>&1 | head -5

      - name: Signing gate before touching a release
        run: |
          python3 tools/verify_release_signing_policy.py --fresh-install
          python3 -m py_compile appdisabler/tools/publish_appdisabler_0_2_0.py
      - name: Publish only the pinned owner-tested APK, no rebuild
        run: |
          set -o pipefail
          python3 appdisabler/tools/publish_appdisabler_0_2_0.py 2>&1 | tee publisher.log
      - name: Upload the write probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appdisabler-write-probe
          path: write-probe.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Commit the failure log to ci-logs (run logs are blocked in the sandbox)
        if: failure()
        run: |
          set -e
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          mkdir -p ci-logs
          cp publisher.log "ci-logs/appdisabler-publish-$(date +%Y%m%d-%H%M%S).log" || true
          # The probe transcript goes here too: artifact archives and run logs are both on a host
          # the authoring sandbox cannot reach, so a committed file is the only readable channel.
          cp write-probe.txt "ci-logs/appdisabler-write-probe-$(date +%Y%m%d-%H%M%S).log" || true
          git add ci-logs/
          git commit -m "ci: capture appdisabler publisher failure [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appdisabler-0.1.0-publication-receipt
          path: ${{ runner.temp }}/appdisabler-publication-receipt.json
          retention-days: 30
          if-no-files-found: warn
