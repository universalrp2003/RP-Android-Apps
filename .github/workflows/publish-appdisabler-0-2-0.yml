name: Publish owner-tested System App Disabler 0.2.0 (exact tested bytes only)

# 0.2.0 publisher: pinned to candidate run 43410268620 / artifact 14028948231, the exact build the owner tested. It must not fire on ordinary pushes any more: it refuses an
# existing tag by design and every push would otherwise queue a guaranteed failure. Publication of
# a *new* version means editing the pins below and dispatching this workflow by hand.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-exact-appdisabler-0-2-0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # gh requires GH_TOKEN in Actions (without it, every gh call exits 4), and the token it is given
    # carries the `permissions:` block above.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Diagnose every release path this job may use
        run: |
          set -uo pipefail
          exec > >(tee write-probe.txt) 2>&1
          R="$GH_REPO"; T="diag-${GITHUB_RUN_ID}"
          echo "run=${GITHUB_RUN_ID}"

          echo "=== A: gh release create (the command that fails) ==="
          echo probe > /tmp/a.txt
          gh release create "$T-a" --target "$GITHUB_SHA" --draft -t "$T" -n "probe" "/tmp/a.txt#a.txt" 2>&1 | tail -3 || true
          gh api -X DELETE "repos/$R/releases/tags/$T-a" >/dev/null 2>&1 || true
          gh api -X DELETE "repos/$R/git/refs/tags/$T-a" >/dev/null 2>&1 || true

          echo "=== B: REST create + gh release upload ==="
          if id=$(gh api -X POST "repos/$R/releases" -f tag_name="$T-b" -f target_commitish="$GITHUB_SHA" -f name="$T" -F draft=true -f body=probe -q .id 2>&1); then
            echo "B_create=ok id=$id"
            gh release upload "$T-b" /tmp/a.txt 2>&1 | tail -2 || true
            gh api "repos/$R/releases/$id/assets" -q '.[].name' 2>&1 | head -3 || true
            gh api -X DELETE "repos/$R/releases/$id" >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$R/git/refs/tags/$T-b" >/dev/null 2>&1 || true
          else echo "B_create=denied :: $id"; fi

          echo "=== C: REST create + REST upload with the asset upload_url host ==="
          if out=$(gh api -X POST "repos/$R/releases" -f tag_name="$T-c" -f target_commitish="$GITHUB_SHA" -f name="$T" -F draft=true -f body=probe 2>&1); then
            id=$(printf '%s' "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            url=$(printf '%s' "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')
            echo "C_create=ok id=$id"
            echo "C_upload_url=$url"
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain" \
                 --data-binary @/tmp/a.txt "${url}?name=c.txt" -o /tmp/c.out -w "C_upload_http=%{http_code}\n" || true
            head -c 200 /tmp/c.out || true
            gh api -X DELETE "repos/$R/releases/$id" >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$R/git/refs/tags/$T-c" >/dev/null 2>&1 || true
          else echo "C_create=denied"; fi

          echo "=== done (every throwaway removed) ==="

      - name: Signing gate before touching a release
        run: |
          python3 tools/verify_release_signing_policy.py --fresh-install
          python3 -m py_compile appdisabler/tools/publish_appdisabler_0_2_0.py
      - name: Publish only the pinned owner-tested APK, no rebuild
        run: |
          set -o pipefail
          python3 appdisabler/tools/publish_appdisabler_0_2_0.py 2>&1 | tee publisher.log
      - name: Upload the write probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appdisabler-write-probe
          path: write-probe.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Commit the failure log to ci-logs (run logs are blocked in the sandbox)
        if: failure()
        run: |
          set -e
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          mkdir -p ci-logs
          cp publisher.log "ci-logs/appdisabler-publish-$(date +%Y%m%d-%H%M%S).log" || true
          # The probe transcript goes here too: artifact archives and run logs are both on a host
          # the authoring sandbox cannot reach, so a committed file is the only readable channel.
          cp write-probe.txt "ci-logs/appdisabler-write-probe-$(date +%Y%m%d-%H%M%S).log" || true
          git add ci-logs/
          git commit -m "ci: capture appdisabler publisher failure [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appdisabler-0.1.0-publication-receipt
          path: ${{ runner.temp }}/appdisabler-publication-receipt.json
          retention-days: 30
          if-no-files-found: warn
