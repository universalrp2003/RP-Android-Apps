name: System App Disabler stock emulator smoke

# This runs the already-built candidate, never a rebuilt APK or a release publisher.
on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/appdisabler-stock-emulator.yml'
      - 'tools/appdisabler-emulator-candidate-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stock-android-smoke:
    name: Stock Android ${{ matrix.android }} launch and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            android: '15'
          - api: 36
            android: '16'
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact previously built 0.3.0 release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          gh run download 43529764131 -n appdisabler-0.3.0-release-candidate -D "$RUNNER_TEMP/candidate"
          test -f "$RUNNER_TEMP/candidate/appdisabler-release.apk"
          echo '344d1d5cf8c04f5f813a695cc3abe5379be2c2d8b316979ff151bc0915fcdf7a  '"$RUNNER_TEMP/candidate/appdisabler-release.apk" | sha256sum -c -
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run stock emulator smoke (no Shizuku)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: |
            bash -o pipefail -c 'bash tools/appdisabler-emulator-candidate-smoke.sh "$RUNNER_TEMP/candidate/appdisabler-release.apk" 344d1d5cf8c04f5f813a695cc3abe5379be2c2d8b316979ff151bc0915fcdf7a "$RUNNER_TEMP/emulator-evidence" 2>&1 | tee "$RUNNER_TEMP/emulator-smoke.log"'
      - name: Surface smoke diagnostic
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          log = Path(os.environ["RUNNER_TEMP"]) / "emulator-smoke.log"
          text = log.read_text(errors="replace")[-6000:] if log.exists() else "Smoke script did not start; inspect emulator setup."
          print("::error title=Emulator smoke diagnostic::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appdisabler-stock-android-${{ matrix.android }}-smoke
          path: ${{ runner.temp }}/emulator-evidence/
          if-no-files-found: ignore
          retention-days: 14
