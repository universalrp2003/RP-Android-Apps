name: Kurippu exact candidate upgrade check (no publication)
on:
  push:
    branches: ["arena/30198928-rp-android-apps"]
    paths: ["tools/kurippu_upgrade_smoke.py", ".github/workflows/kurippu-upgrade-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kurippu-0.1-candidate
          run-id: 45778178557
          github-token: ${{ github.token }}
          path: /tmp/kurippu-old
      - uses: actions/download-artifact@v4
        with:
          name: Kurippu-0.2-candidate
          run-id: 45785691669
          github-token: ${{ github.token }}
          path: /tmp/kurippu-new
      - run: sudo chmod a+rw /dev/kvm
      - name: Install old candidate, enter synthetic data, upgrade exact APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -memory 1536 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: OLD_APK=/tmp/kurippu-old/Kurippu-v0.1.apk NEW_APK=/tmp/kurippu-new/Kurippu-v0.2.apk python3 tools/kurippu_upgrade_smoke.py
