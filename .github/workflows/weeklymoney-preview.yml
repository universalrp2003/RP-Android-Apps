name: Weekly Money isolated preview
on:
  push:
    branches: ["arena/1cd060b0-rp-android-apps"]
    paths:
      - "weeklymoney/**"
      - ".github/workflows/weeklymoney-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/arena/1cd060b0-rp-android-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Check app 17 identity and offline source contract
        run: python3 -m unittest discover -s weeklymoney/checks -v
      - name: Test, lint and build offline preview only
        run: ./gradlew :weeklymoney:testDebugUnitTest :weeklymoney:lintDebug :weeklymoney:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WeeklyMoney-UNVERIFIED-PREVIEW-not-for-real-records
          path: |
            weeklymoney/app/build/outputs/apk/debug/*.apk
            weeklymoney/app/build/test-results/testDebugUnitTest/
            weeklymoney/app/build/reports/lint-results-debug.html
          retention-days: 14
