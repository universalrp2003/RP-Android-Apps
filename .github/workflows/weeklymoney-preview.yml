name: Weekly Money isolated preview
on:
  push:
    branches: ["arena/1cd060b0-rp-android-apps"]
    paths:
      - "weeklymoney/**"
      - ".github/workflows/weeklymoney-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/arena/1cd060b0-rp-android-apps'
    runs-on: ubuntu-latest
    env:
      RP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare persistent owner-backed preview signer (no publication)
        uses: ./.github/actions/prepare-release-signing
        with:
          keystore-base64: ${{ secrets.RP_RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
      - name: Verify runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Using GitHub-hosted runner Android SDK"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check app 17 identity and offline source contract
        run: python3 -m unittest discover -s weeklymoney/checks -v
      - name: Test, lint and build offline preview only
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./gradlew :weeklymoney:testDebugUnitTest :weeklymoney:lintDebug :weeklymoney:assembleDebug --console=plain > weeklymoney-build.log 2>&1
          result=$?
          tail -100 weeklymoney-build.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('weeklymoney-build.log').read_text(errors='replace').splitlines()
          message = '\n'.join(lines[-100:])[-12000:]
          print('::error title=Weekly Money build failure::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$result"
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Release build-daemon memory before starting emulator
        run: ./gradlew --stop
      - name: Native book-save, restart persistence and screenshot-switch regression
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          emulator-boot-timeout: 180
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -memory 1536 -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh -c 'adb logcat -v time -s WeeklyMoneyRegression TestRunner > weeklymoney-device.log 2>&1 & logger=$!; timeout -k 15s 420s ./gradlew :weeklymoney:connectedDebugAndroidTest --console=plain --no-parallel --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2048m -Pkotlin.compiler.execution.strategy=in-process > weeklymoney-native.log 2>&1; result=$?; kill "$logger" 2>/dev/null || true; timeout -k 5s 20s adb pull /sdcard/Pictures/WeeklyMoneySynthetic/synthetic-notebook.png weeklymoney/app/build/synthetic-notebook.png || true; exit "$result"'
      - name: Expose bounded native regression failure
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          p = Path('weeklymoney-native.log')
          if p.exists():
              message = p.read_text(errors='replace')[-12000:]
              print('::error title=Weekly Money native test::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          device = Path('weeklymoney-device.log')
          if device.exists():
              message = device.read_text(errors='replace')[-3000:]
              print('::error title=Native progress::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          for p in Path('weeklymoney/app/build/outputs/androidTest-results').rglob('*.xml'):
              message = p.read_text(errors='replace')[:24000]
              for index in range(0, len(message), 3000):
                  chunk = message[index:index+3000]
                  print(f'::error title=Native XML {index//3000}::' + chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
      - name: Record native regression receipt
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('weeklymoney/app/build/outputs/androidTest-results').rglob('*.xml'):
              root = ET.parse(path).getroot()
              print(f"::notice title=Native test receipt::{root.attrib}")
      - name: Record exact APK digest and pinned signer
        run: |
          directory=weeklymoney/app/build/outputs/apk/debug
          file=$(python3 -c 'import json; print(json.load(open("weeklymoney/app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["outputFile"])')
          apk="$directory/$file"
          python3 -c 'import json; m=json.load(open("weeklymoney/app/build/outputs/apk/debug/output-metadata.json")); assert m["applicationId"]=="com.universalrp.weeklymoney.preview.notebook"; assert m["elements"][0]["versionCode"]==10'
          test -f "$apk" || { echo "::error::Metadata APK is missing: $file"; exit 1; }
          (cd "$directory" && sha256sum "$file" > "$file.sha256")
          echo "::notice title=APK SHA256::$(cat "$apk.sha256")"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk" > weeklymoney/app/build/outputs/apk/debug/signer.txt
          cat "$directory/signer.txt"
          if ! grep -q 'certificate SHA-256 digest: 7366d76dc5a9032424f032f1530f661366d880af37657374df85ca7a6299747d' "$directory/signer.txt"; then
            echo "::error title=APK signer mismatch::$(cat "$directory/signer.txt")"
            exit 1
          fi
          echo "::notice title=APK signer::7366d76dc5a9032424f032f1530f661366d880af37657374df85ca7a6299747d"
      - name: Preserve verified notebook APK and build isolated demo APK
        shell: bash
        run: |
          set -euo pipefail
          directory=weeklymoney/app/build/outputs/apk/debug
          handover=weeklymoney/app/build/handover
          mkdir -p "$handover/notebook" "$handover/demo" "$handover/samples"
          file=$(python3 -c 'import json; print(json.load(open("weeklymoney/app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["outputFile"])')
          cp "$directory/$file" "$handover/notebook/WeeklyMoney-TEST0.10.apk"
          cp "$directory/signer.txt" "$handover/notebook/signer.txt"
          (cd "$handover/notebook" && sha256sum WeeklyMoney-TEST0.10.apk > WeeklyMoney-TEST0.10.apk.sha256)
          ./gradlew :weeklymoney:assembleDebug -PweeklymoneySample=true --console=plain
          python3 -c 'import json; m=json.load(open("weeklymoney/app/build/outputs/apk/debug/output-metadata.json")); assert m["applicationId"]=="com.universalrp.weeklymoney.preview.sample"; assert m["elements"][0]["versionCode"]==10'
          file=$(python3 -c 'import json; print(json.load(open("weeklymoney/app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["outputFile"])')
          cp "$directory/$file" "$handover/demo/WeeklyMoney-DEMO0.10.apk"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$handover/demo/WeeklyMoney-DEMO0.10.apk" > "$handover/demo/signer.txt"
          grep -q 'certificate SHA-256 digest: 7366d76dc5a9032424f032f1530f661366d880af37657374df85ca7a6299747d' "$handover/demo/signer.txt"
          (cd "$handover/demo" && sha256sum WeeklyMoney-DEMO0.10.apk > WeeklyMoney-DEMO0.10.apk.sha256)
          cp weeklymoney/samples/* "$handover/samples/"
          echo "::notice title=Demo APK SHA256::$(cat "$handover/demo/WeeklyMoney-DEMO0.10.apk.sha256")"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WeeklyMoney-0.10-calendar-preview-and-isolated-demo
          path: |
            weeklymoney/app/build/handover/
            weeklymoney/app/build/test-results/testDebugUnitTest/
            weeklymoney/app/build/outputs/androidTest-results/
            weeklymoney/app/build/reports/androidTests/connected/
            weeklymoney/app/build/reports/lint-results-debug.html
            weeklymoney/app/build/synthetic-notebook.png
          retention-days: 14
