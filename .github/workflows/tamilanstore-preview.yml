name: Tamilan Store preview (no publication)
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "tamilanstore/**"
      - ".github/workflows/tamilanstore-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamilan-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Test and compile preview
        run: gradle :tamilanstore:testDebugUnitTest :tamilanstore:lintDebug :tamilanstore:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: tamilan-store-preview
          path: tamilanstore/build/outputs/apk/debug/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tamilan-store-test-reports
          path: tamilanstore/build/reports/
          retention-days: 14
