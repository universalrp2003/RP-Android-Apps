name: Inspect zebra finch research archive (no model execution)
on:
  push:
    branches: ["arena/b0b465b9-rp-android-apps"]
    paths: ["animalvoice/research/**", "animalvoice/tests/**", ".github/workflows/animal-zf-research.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded ZIP reader
        run: python3 -m unittest discover -s animalvoice/tests -v
      - name: Inspect upstream archive metadata only
        run: |
          set -o pipefail
          python3 animalvoice/research/inspect_zf_archive.py > "$RUNNER_TEMP/zf-inventory.json" 2> "$RUNNER_TEMP/zf-error.txt"
      - name: Report archive structure (not a model verification)
        shell: python
        run: |
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'zf-inventory.json'
          d=json.loads(p.read_text())
          def notice(title, value):
              print('::notice title='+title+'::'+value.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          for f in d['source_files']:
              if not any(x in f['path'] for x in ('config.live.model_with_pregen_calls.yml','models/interaction.py','models/response2waveform.py')): continue
              for i in range(0,min(len(f['content']),9000),3000):
                  notice('Source '+f['path']+' part '+str(i//3000+1),f['content'][i:i+3000])
          useful=[f for f in d['pipeline_files'] if '/samples/' not in f['path'] and (f['bytes']>1000000 or 'subset/' in f['path'])]
          notice('Candidate pipeline files', '\n'.join(f"{f['bytes']} bytes: {f['path']}" for f in useful[:25]))
      - name: Show bounded failure
        if: failure()
        run: |
          if [ -s "$RUNNER_TEMP/zf-error.txt" ]; then
            msg=$(head -c 4000 "$RUNNER_TEMP/zf-error.txt" | tr '\n' ' ')
            echo "::error title=ZF archive inspection::$msg"
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zebra-finch-research-archive-inventory
          path: ${{ runner.temp }}/zf-inventory.json
          retention-days: 14
