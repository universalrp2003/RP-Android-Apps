name: Android TV Guard Candidate APK Build

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "tvguard/**"
      - ".github/workflows/tvguard-candidate.yml"
  workflow_dispatch:
    inputs:
      signed_candidate:
        description: 'Build and test an unpublished, stable-signed TV candidate'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: tvguard-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.signed_candidate == false
    name: Build, test, and package Android TV Guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Check TV Guard string resources before building
        run: python3 tools/verify_tvguard_resources.py

      - name: Test and assemble TV Guard
        shell: bash
        run: |
          gradle :tvguard:testDebugUnitTest :tvguard:lintDebug :tvguard:assembleDebug --no-daemon --stacktrace 2>&1 | tee tvguard-build.log

      - name: Verify required unit tests actually ran
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          roots = [ET.parse(p).getroot() for p in Path('tvguard/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          cases = [c for root in roots for c in root.iter('testcase')]
          classes = {c.get('classname', '').rsplit('.', 1)[-1] for c in cases}
          # New coverage: the long-press fix (including a remote that never auto-repeats),
          # overlay thresholds and pill wording, and thermal readings. All required.
          # The AI client and microphone-shortcut tests were removed with the AI feature, so
          # the floor dropped from 70 to the 64 cases that remain.
          required = {'TvFeatureSettingsTest', 'HubFeaturesTest', 'HubFileNamesTest', 'SafeUploadStorageTest', 'HardwareVerificationTest', 'VoiceAssistantTest', 'AppTileKeyPolicyTest', 'StatusThresholdsTest', 'OverlayPresentationTest', 'ThermalReaderTest'}
          assert len(cases) >= 64 and required <= classes, 'Required TV Guard unit tests did not run'
          assert all(all(c.find(kind) is None for kind in ('failure', 'error', 'skipped')) for c in cases), 'A TV Guard unit test failed or was skipped'
          print(f'::notice title=TV Guard unit tests::{len(cases)} unit tests passed, including feature, transfer, hardware and voice checks')
          PY

      - name: Expose actionable compiler and lint errors
        if: failure()
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          import re
          paths = [Path("tvguard-build.log"), *Path("tvguard/app/build/reports").glob("lint-results-*.txt")]
          found = []
          for path in paths:
              if not path.exists(): continue
              for line in path.read_text(errors="replace").splitlines():
                  if re.search(r"(^e: |error:|Error:|What went wrong|Execution failed|FAILURE:|requires|Dependency |Minimum supported)", line):
                      found.append(line[:1500])
          for line in found[:35]:
              text = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=TV Guard build diagnostic::" + text)
          import xml.etree.ElementTree as ET
          for path in Path('tvguard/app/build/test-results').rglob('TEST-*.xml'):
              try: root = ET.parse(path).getroot()
              except ET.ParseError: continue
              for case in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      failure = case.find(kind)
                      if failure is not None:
                          text = case.get('classname', '') + '.' + case.get('name', '') + '\n' + (failure.text or '')
                          print('::error title=TV Guard unit test::' + text[:10000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYDIAG

      - name: Explain debug APK limits
        run: echo '::warning title=Emulator-only APK::This debug APK uses a temporary key and cannot update an existing installation. Use only on a disposable emulator.'

      - uses: actions/upload-artifact@v4
        with:
          name: tvguard-emulator-only-debug-apk
          path: tvguard/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvguard-test-reports
          path: tvguard/app/build/reports/
          retention-days: 14

  # Manual only: a disposable Android TV emulator, not a release or OEM-device test.
  tv-focus:
    name: Exercise D-pad navigation on Android TV
    if: github.event_name == 'workflow_dispatch' && inputs.signed_candidate == false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run focus and opt-in service tests on a disposable TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: |
            case "$(adb get-serialno)" in emulator-*) ;; *) echo 'Expected a disposable emulator'; exit 1 ;; esac
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash -o pipefail -c 'gradle -PtvguardTestBuildType=debug :tvguard:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/tvguard-android-test.log"'
      - name: Require every TV focus test to run and pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          roots = [ET.parse(p).getroot() for p in Path('tvguard/app/build/outputs/androidTest-results/connected').rglob('*.xml')]
          all_cases = [c for root in roots for c in root.iter('testcase')]
          cases = [c for c in all_cases if c.get('classname', '').endswith('TvRemoteFocusTest')]
          expected = {
              'appOptionsDirectionsStayInDialogAndHomeResetsEvenWhileAlreadyHome',
              'expertSwitchesNavigateWithDpadAndRevokeAndRestoreHub',
              'downFromDebloaterHeaderEntersItsControlsAndHomeReturnsToFirstApp',
              'networkAndAboutHeadersLeadIntoTheirOwnContent',
              'appendedExpertSwitchesAreReachableScrolledAndOffByDefault',
          }
          assert len(cases) == len(expected) and {c.get('name') for c in cases} == expected, 'Missing or duplicate TV focus tests'
          # The long-press regression tests must also run, and all four of them.
          press_cases = [c for c in all_cases if c.get('classname', '').endswith('TvLongPressOptionsTest')]
          expected_press = {
              'longPressOpensOptionsAndReleaseDoesNotLaunchOrClose',
              'shortPressStillLaunchesOrKeepsFocusOnTheLauncher',
              'aRemoteThatAutoRepeatsAlsoOpensTheMenuExactlyOnce',
              'dismissingOptionsRestoresFocusToTheTile',
              'afterTheMenuClosesAShortPressLaunchesAgain',
          }
          assert len(press_cases) == len(expected_press) and {c.get('name') for c in press_cases} == expected_press, 'Missing or duplicate long-press regression tests'
          combined = cases + press_cases
          assert all(all(c.find(kind) is None for kind in ('failure', 'error', 'skipped')) for c in combined), 'A TV focus test failed or was skipped'
          print(f'::notice title=Android TV focus tests::{len(combined)} Android TV tests passed, including real key-down/hold/up long-press checks')
          PY
      - name: Surface TV test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import os
          failures = 0
          for path in Path('tvguard/app/build/outputs/androidTest-results').rglob('*.xml'):
              try: root = ET.parse(path).getroot()
              except ET.ParseError: continue
              for case in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      for failure in case.findall(kind):
                          failures += 1
                          name = case.get('name', '')
                          text = failure.get('message', '') + '\n' + (failure.text or '')
                          details = '\n'.join(line for line in text.splitlines() if 'Caused by:' in line or 'TvRemoteFocusTest.kt:' in line)
                          summary = name + '\n' + text[:2600] + ('\n' + details if details else '')
                          print('::error title=TV focus test::' + summary[:3800].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          log = Path(os.environ['RUNNER_TEMP'], 'tvguard-android-test.log')
          if not failures and log.exists():
              lines = log.read_text(errors='replace').splitlines()
              # A compile error or a task failure scrolls off the tail behind a Gradle stack
              # trace, so keep the diagnostic lines from anywhere in the log and only then add
              # the tail. Without this the annotation only says 'sh exited with code 1'.
              cues = ('e: ', 'error:', 'warning: ', 'What went wrong', 'Execution failed for task',
                      'FAILED', '> Task', 'Caused by:', 'Could not', 'No connected devices')
              picked = [line for line in lines if any(cue in line for cue in cues)]
              text = '\n'.join(picked[-120:] + ['--- tail ---'] + lines[-40:])
              print('::error title=TV emulator diagnostic::' + text[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvguard-tv-focus-reports
          path: |
            tvguard/app/build/reports/androidTests/
            tvguard/app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: warn

  # This is an unpublished candidate. The keystore is available only inside this job.
  signed-candidate:
    name: Verify a stable-signed TV candidate and update continuity
    if: github.event_name == 'workflow_dispatch' && inputs.signed_candidate == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare and verify the existing private signing identity
        uses: ./.github/actions/prepare-release-signing
        with:
          keystore-base64: ${{ secrets.RP_RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Retrieve an older incompatible test APK for a disposable emulator
        uses: actions/download-artifact@v4
        with:
          name: tvguard-debug-apk
          run-id: 42930753694
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tvguard-old-debug
      - name: Build the synthetic old version and the signed candidate
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tvguard-signed-candidate"
          mkdir -p "$work"
          python3 tools/verify_tvguard_resources.py
          python3 -m unittest discover -s tvguard/tools -p 'test_*.py' -v
          python3 tools/verify_apps_localization.py
          gradle -PtvguardRequireStableSigner=true -PtvguardSignedUpgradeFixture=true :tvguard:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$work/fixture-build.log"
          mapfile -t fixture < <(find tvguard/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f)
          test "${#fixture[@]}" -eq 1
          cp "${fixture[0]}" "$work/synthetic-older-same-key.apk"
          gradle -PtvguardRequireStableSigner=true :tvguard:testReleaseUnitTest :tvguard:lintRelease :tvguard:assembleRelease :tvguard:assembleReleaseAndroidTest --no-daemon --stacktrace 2>&1 | tee "$work/candidate-build.log"
          mapfile -t candidate < <(find tvguard/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f)
          mapfile -t test_apk < <(find tvguard/app/build/outputs/apk/androidTest/release -maxdepth 1 -name '*.apk' -type f)
          test "${#candidate[@]}" -eq 1 && test "${#test_apk[@]}" -eq 1
          cp "${candidate[0]}" "$work/Android-TV-Guard-1.2-signed-candidate.apk"
          cp "${test_apk[0]}" "$work/tvguard-release-androidTest.apk"
      - name: Verify release unit tests and exact APK identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          roots = [ET.parse(p).getroot() for p in Path('tvguard/app/build/test-results/testReleaseUnitTest').glob('TEST-*.xml')]
          cases = [c for root in roots for c in root.iter('testcase')]
          classes = {c.get('classname', '').rsplit('.', 1)[-1] for c in cases}
          required = {'TvFeatureSettingsTest', 'HubFeaturesTest', 'HubFileNamesTest', 'SafeUploadStorageTest', 'HardwareVerificationTest', 'VoiceAssistantTest', 'AppTileKeyPolicyTest', 'StatusThresholdsTest', 'OverlayPresentationTest', 'ThermalReaderTest'}
          assert len(cases) >= 64 and required <= classes, 'Required release unit tests did not run'
          assert all(all(c.find(kind) is None for kind in ('failure', 'error', 'skipped')) for c in cases), 'A release unit test failed or was skipped'
          print(f'::notice title=TV Guard release unit tests::{len(cases)} release unit tests passed')
          PY
          bash tvguard/tools/verify_signed_artifacts.sh
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Exact signed APK, mismatch, same-key upgrade and TV navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: bash -o pipefail -c 'bash tvguard/tools/signed_candidate_smoke.sh 2>&1 | tee "$RUNNER_TEMP/tvguard-signed-candidate/smoke.log"'
      - name: Record the exact verified candidate
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from prepare_release_signing import EXPECTED_SIGNER
          work = Path(os.environ['RUNNER_TEMP'], 'tvguard-signed-candidate')
          apk = work / 'Android-TV-Guard-1.2-signed-candidate.apk'
          sha = hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest()
          assert (work / 'Android-TV-Guard-1.2-signed-candidate.sha256').read_text().split()[0] == sha
          receipt = {
              'package': 'com.universalrp.tvguard', 'versionName': '1.2', 'versionCode': 4,
              'signerSha256': EXPECTED_SIGNER, 'apkSha256': sha, 'apkBytes': apk.stat().st_size,
              'sourceCommit': os.environ['GITHUB_SHA'], 'workflowRun': os.environ['GITHUB_RUN_ID'],
              'exactCandidateInstalledAndTested': True, 'published': False,
              'tests': ['release unit tests and lint', 'API 34 Android TV focus tests',
                        'different-signer replacement rejected without deleting old data',
                        'synthetic same-signer code 1 to code 4 update preserves favorites, hidden apps, feature choices and a private file'],
              'limitations': 'Disposable emulator only; physical TV, remote, voice, root and screenshot behavior are not verified.'
          }
          (work / 'verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('::notice title=Signed TV candidate::Exact tested candidate SHA-256 ' + sha)
          PY
      - name: Offer only the exact tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: tvguard-1.2-stable-signed-tested-candidate
          path: |
            ${{ runner.temp }}/tvguard-signed-candidate/Android-TV-Guard-1.2-signed-candidate.apk
            ${{ runner.temp }}/tvguard-signed-candidate/Android-TV-Guard-1.2-signed-candidate.sha256
            ${{ runner.temp }}/tvguard-signed-candidate/verification.json
          retention-days: 30
          if-no-files-found: error
      - name: Surface bounded candidate failures
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          work = Path(os.environ['RUNNER_TEMP'], 'tvguard-signed-candidate')
          for path in sorted(work.glob('*.log')):
              if path.name == 'incompatible-install.log': continue  # This failure is expected in the synthetic check.
              lines = path.read_text(errors='replace').splitlines()
              selected = [line for line in lines if re.search(r'(^e: |Error:|error:|FAILURE:|Exception|AssertionError|Instrumentation verification failed|INSTALL_FAILED)', line)]
              if selected:
                  text = path.name + ': ' + '\n'.join(selected[-12:])
                  print('::error title=TV signed candidate::' + text[-3500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tvguard-signed-candidate-diagnostics
          path: |
            ${{ runner.temp }}/tvguard-signed-candidate/*.log
            ${{ runner.temp }}/tvguard-signed-candidate/*-badging.txt
            ${{ runner.temp }}/tvguard-signed-candidate/*-signer.txt
            ${{ runner.temp }}/tvguard-signed-candidate/*-manifest.txt
            tvguard/app/build/reports/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove temporary signing material
        if: always()
        run: rm -f ci-keystore/release.p12
