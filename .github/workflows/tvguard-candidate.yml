name: Android TV Guard Candidate APK Build

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "tvguard/**"
      - ".github/workflows/tvguard-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvguard-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package Android TV Guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Test and assemble TV Guard
        shell: bash
        run: |
          gradle :tvguard:testDebugUnitTest :tvguard:lintDebug :tvguard:assembleDebug --no-daemon --stacktrace 2>&1 | tee tvguard-build.log

      - name: Expose actionable compiler and lint errors
        if: failure()
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          import re
          paths = [Path("tvguard-build.log"), *Path("tvguard/app/build/reports").glob("lint-results-*.txt")]
          found = []
          for path in paths:
              if not path.exists(): continue
              for line in path.read_text(errors="replace").splitlines():
                  if re.search(r"(^e: |error:|Error:|What went wrong|Execution failed|FAILURE:|requires|Dependency |Minimum supported)", line):
                      found.append(line[:1500])
          for line in found[:35]:
              text = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=TV Guard build diagnostic::" + text)
          PYDIAG

      - uses: actions/upload-artifact@v4
        with:
          name: tvguard-debug-apk
          path: tvguard/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvguard-test-reports
          path: tvguard/app/build/reports/
          retention-days: 14
