name: Publish authorized Store0.13 exact tested bytes
on:
  push:
    branches: ["arena/745a8cb3-rp-android-apps"]
    paths:
      - "docs/approved-store-0.13-candidate.json"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-exact-store-013-2026-11-13
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPROVED_STORE_0_13_PUBLICATION: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Signing and provenance gates before touching a release
        run: |
          python3 tools/verify_release_signing_policy.py --fresh-install
          python3 -m py_compile tools/promote_verified_store_013.py
          test -f releases/tamilan-store-v0.13.md
      - name: Promote only the pinned exact upgrade-tested Store APK
        run: python3 tools/promote_verified_store_013.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store013-exact-publication-receipt
          path: ${{ runner.temp }}/store013-publication-receipt.json
          retention-days: 30
          if-no-files-found: warn
