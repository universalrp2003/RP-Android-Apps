name: Inspect tested TV candidate receipts (read only)
on:
  push:
    branches: ["arena/30198928-rp-android-apps"]
    paths: [".github/workflows/inspect-tv-safety-candidates.yml"]
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
    steps:
      - name: Download the two tested candidate artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tv" "$RUNNER_TEMP/disabler"
          gh run download 45546027796 --name tvguard-1.5.2-stable-signed-tested-candidate --dir "$RUNNER_TEMP/tv"
          gh run download 45546028062 --name appdisabler-0.5.0-stable-signed-tested-candidate --dir "$RUNNER_TEMP/disabler"
      - name: Check receipts against exact bytes
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for folder, name, sha in [
              ('tv','Android-TV-Guard-1.5.2-signed-candidate.apk','66acfaa601394bed85b3628e22214b56903427c2cd37c042c36a285f22251443'),
              ('disabler','System-App-Disabler-0.5.0-signed-candidate.apk','1f9846d8d995520530ea1d9b2602daf16f8856c4371191c8d0561cba3d97b920')]:
              directory = root / folder
              apk = directory / name
              receipt = json.loads((directory / 'verification.json').read_text())
              assert hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest() == sha == receipt['apkSha256']
              assert apk.stat().st_size == receipt['apkBytes'] and receipt['exactCandidateInstalledAndTested'] and not receipt['published']
              print('::notice title=' + folder + ' exact candidate receipt::' + json.dumps(receipt, separators=(',', ':')))
          PY
