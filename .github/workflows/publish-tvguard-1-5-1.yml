name: Publish owner-approved Android TV Guard 1.5.1 (exact tested bytes only)

on:
  push:
    branches: ["arena/60062a79-rp-android-apps"]
    paths: ["tvguard/tools/publish_verified_candidate.py"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-exact-tvguard-1-5-1
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Resource and signing gates before touching a release
        run: |
          python3 tools/verify_tvguard_resources.py
          python3 tools/verify_release_signing_policy.py --fresh-install
          python3 -m py_compile tvguard/tools/publish_verified_candidate.py
      - name: Publish only the pinned owner-tested APK, no rebuild
        run: python3 tvguard/tools/publish_verified_candidate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tvguard-1.5.1-publication-receipt
          path: ${{ runner.temp }}/tvguard-publish/tvguard-1.5.1-publication-receipt.json
          retention-days: 30
          if-no-files-found: warn
