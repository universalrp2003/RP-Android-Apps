name: HD voice recovery (no publication)
on:
  push:
    branches: ["arena/**"]
    paths:
      - "shared/src/main/java/com/universalrp/voice/**"
      - "smsguard/**"
      - ".github/workflows/hd-voice-failover.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hd-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Deterministic regressions and actual HD failover within 4200ms
        run: gradle :smsguard:testHdVoiceFailover --no-daemon --stacktrace
      - name: Bounded failures and actual selected HD identity (synthetic text only)
        if: always()
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          for file in pathlib.Path('smsguard/build/test-results').rglob('TEST-*.xml'):
              root = ET.parse(file).getroot()
              print('::notice title=HD test results::' + str(file) + ' tests=' + root.get('tests','?') + ' failures=' + root.get('failures','?'))
              for output in root.findall('system-out'):
                  for line in (output.text or '').splitlines():
                      if line.startswith('SMS_LIVE_PROFILE '):
                          print('::notice title=Actual HD failover::' + line[:1200].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              for failure in root.findall('.//failure') + root.findall('.//error'):
                  print('::error title=HD failure::' + failure.get('message','')[:900].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hd-recovery-test-reports
          path: smsguard/build/test-results/
          retention-days: 14
