name: TV Guard real Shizuku integration (no publication)
on:
  push:
    branches: ["arena/30198928-rp-android-apps"]
    paths: ["tvguard/**", ".github/workflows/tvguard-shizuku-integration.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tvguard-real-shizuku-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shizuku:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Fetch official fixed Shizuku release for the disposable emulator
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shizuku"
          gh release download v13.6.0 --repo RikkaApps/Shizuku --pattern 'shizuku-v13.6.0.r1086.2650830c-release.apk' --dir "$RUNNER_TEMP/shizuku"
          test "$(stat -c %s "$RUNNER_TEMP/shizuku/shizuku-v13.6.0.r1086.2650830c-release.apk")" = 2571773
      - name: Build disposable debug app and test
        run: gradle -PtvguardTestBuildType=debug :tvguard:assembleDebug :tvguard:assembleDebugAndroidTest --no-daemon --stacktrace
      - run: sudo chmod a+rw /dev/kvm
      - name: Start real Shizuku as shell and exercise grant and snapshots on disposable TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: bash tvguard/tools/shizuku_integration_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvguard-shizuku-integration-log
          path: ${{ runner.temp }}/shizuku-test.log
          if-no-files-found: warn
          retention-days: 14
