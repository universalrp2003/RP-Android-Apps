name: Ramesh Radio station gallery verification (no publication)
on:
  push:
    branches: ["arena/30198928-rp-android-apps"]
    paths:
      - "radio/src/main/java/com/universalrp/tamilnadufm/ui/Components.kt"
      - "radio/src/main/java/com/universalrp/tamilnadufm/ui/StationsScreens.kt"
      - "radio/src/main/java/com/universalrp/tamilnadufm/ui/StationGridLayout.kt"
      - "radio/src/test/java/com/universalrp/tamilnadufm/ui/StationGridLayoutTest.kt"
      - ".github/workflows/radio-gallery-check.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radio-gallery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Compile debug and run JVM tests
        run: gradle :radio:testDebugUnitTest :radio:assembleDebug --no-daemon --stacktrace
      - name: Require gallery layout tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('radio/build/test-results/testDebugUnitTest').glob('*StationGridLayoutTest.xml'))
          assert len(files) == 1, files
          root = ET.parse(files[0]).getroot()
          assert int(root.get('tests', '0')) == 2
          assert root.get('failures') == root.get('errors') == root.get('skipped') == '0'
          PY
