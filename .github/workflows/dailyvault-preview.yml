name: Daily Vault preview (no publication)
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "dailyvault/**"
      - ".github/workflows/dailyvault-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-vault-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test and compile preview
        run: gradle :dailyvault:testDebugUnitTest :dailyvault:lintDebug :dailyvault:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: daily-vault-preview
          path: dailyvault/build/outputs/apk/debug/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-vault-test-reports
          path: dailyvault/build/reports/
          retention-days: 14
