name: One-time import
on: workflow_dispatch
permissions:
  contents: write
  workflows: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add old https://github.com/universalrp2003/InternetRadio.git
          git fetch --no-tags old main
          if ! git merge --allow-unrelated-histories --no-ff FETCH_HEAD -m "Import RP Ideas source from InternetRadio (full history)"; then
            git checkout --theirs README.md
            git add README.md
            git checkout --ours LICENSE
            git add LICENSE
            git commit --no-edit
          fi
          git push origin HEAD:main
