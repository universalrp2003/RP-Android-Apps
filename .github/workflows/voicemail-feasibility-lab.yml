name: Device voicemail feasibility lab (private debug)
on:
  push:
    branches: ["arena/eb6de80e-rp-android-apps"]
    paths: ["voicemail-lab/**", ".github/workflows/voicemail-feasibility-lab.yml"]
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Unit test and build isolated debug APK
        run: ./gradlew -p voicemail-lab :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify manifest privacy boundary
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump permissions voicemail-lab/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/lab-perms.txt
          grep -F 'android.permission.RECORD_AUDIO' /tmp/lab-perms.txt
          ! grep -E 'android.permission.(INTERNET|READ_PHONE_STATE|ANSWER_PHONE_CALLS|READ_CONTACTS|CAPTURE_AUDIO_OUTPUT|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' /tmp/lab-perms.txt
      - uses: actions/upload-artifact@v4
        with:
          name: voicemail-feasibility-lab-debug
          path: voicemail-lab/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
