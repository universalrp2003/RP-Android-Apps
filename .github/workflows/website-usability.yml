name: Website usability checks (no deployment)

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "site/**"
      - "tools/website-tests/**"
      - "tools/tests/test_website*.py"
      - "tools/update_website_release_dates.py"
      - ".github/workflows/website-usability.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/website-tests/**"
      - "tools/tests/test_website*.py"
      - "tools/update_website_release_dates.py"
      - ".github/workflows/website-usability.yml"

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/website-tests/package-lock.json
      - name: Check static contracts and recorded publication dates
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_website*.py' -v
          python3 tools/update_website_release_dates.py
          node --check site/site-controls.js
      - name: Install development-only test dependencies
        working-directory: tools/website-tests
        run: |
          set -uo pipefail
          npm ci --ignore-scripts
          # The browser itself ships inside @sparticuz/chromium, so this step only needs the
          # system libraries. `playwright install-deps` drives apt itself and has started
          # failing on newer runner images (Ubuntu 26 rollout), which stopped the run before
          # a single check executed. Try it, then fall back to the libraries directly, and
          # never let library setup be the thing that silently reports a site failure.
          if npx playwright install-deps chromium; then
            echo "playwright install-deps: ok"
          else
            echo "::warning title=Playwright system libraries::install-deps failed; installing the libraries directly"
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
              libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
              || echo "::warning title=Playwright system libraries::direct install also failed; the browser check below will report what is missing"
          fi
      - name: Browser, keyboard, mobile, checksum and accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 0.0.0.0 --directory site > "$RUNNER_TEMP/website-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Website server did not start')
          PY
          node tools/website-tests/usability.mjs
