name: Publish verified Tamilan Store 0.15
on:
  push:
    branches: ["arena/3c5adaf9-rp-android-apps"]
    paths: ["docs/approved-tamilan-store-0.15.json"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-tamilan-store-0-15
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/arena/3c5adaf9-rp-android-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified APK without rebuilding
        run: python3 tools/promote_tamilan_store_0_15.py
