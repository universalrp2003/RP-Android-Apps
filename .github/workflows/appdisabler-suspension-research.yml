name: App Disabler suspension research
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/appdisabler-suspension-research.yml'
      - 'tools/appdisabler-suspension-research.py'
permissions:
  contents: read
jobs:
  probe:
    name: Disposable stock Android ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build disposable launcher fixture
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          cat > "$RUNNER_TEMP/AndroidManifest.xml" <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.universalrp.appdisabler.researchfixture">
            <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="35" />
            <application android:label="Disposable Research Fixture" android:hasCode="false">
              <activity android:name=".Home" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.HOME"/><category android:name="android.intent.category.DEFAULT"/></intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          "$sdk/aapt" package -f -M "$RUNNER_TEMP/AndroidManifest.xml" -I "$ANDROID_HOME/platforms/android-36/android.jar" -F "$RUNNER_TEMP/unsigned.apk"
          "$sdk/zipalign" -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/fixture.jks" -storepass fixturetest -keypass fixturetest -alias fixture -dname 'CN=Disposable Research Fixture' -keyalg RSA -validity 1 >/dev/null 2>&1
          "$sdk/apksigner" sign --ks "$RUNNER_TEMP/fixture.jks" --ks-pass pass:fixturetest --key-pass pass:fixturetest --out "$RUNNER_TEMP/research-fixture.apk" "$RUNNER_TEMP/aligned.apk"
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Measure shell suspension response
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: python3 tools/appdisabler-suspension-research.py "$RUNNER_TEMP/research-fixture.apk"
