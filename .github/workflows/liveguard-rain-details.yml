name: Live Guard rain details preview (no publication)
on:
  push:
    branches: ["arena/1d166a3f-rp-android-apps"]
    paths: ["cleaner/**", "tools/tests/test_rain_forecast_details.py", ".github/workflows/liveguard-rain-details.yml"]
permissions:
  contents: read
concurrency:
  group: rain-details-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: ./.github/actions/prepare-release-signing
        with:
          keystore-base64: ${{ secrets.RP_RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.14.3'}
      - name: Source and bilingual gates
        run: |
          python3 -m unittest discover -s tools/tests -q
          python3 tools/verify_cleaner_localization.py
          python3 tools/verify_apps_localization.py
      - name: Release JVM, lint and test-only Android assembly
        run: gradle :cleaner:testReleaseUnitTest :cleaner:lintRelease :cleaner:assembleRelease :cleaner:assembleReleaseAndroidTest --no-daemon --stacktrace
      - name: New timeline regressions all executed
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as E
          reports=list(Path('cleaner/build/test-results/testReleaseUnitTest').glob('*RainForecastDetailsTest.xml'))
          assert len(reports)==1
          root=E.parse(reports[0]).getroot()
          assert int(root.get('tests'))==4 and int(root.get('failures'))==0 and int(root.get('errors'))==0 and int(root.get('skipped','0'))==0
          PYTEST
      - run: sudo chmod a+rw /dev/kvm
      - name: Actual English Tamil 100 and 200 percent rain detail UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: |
            adb install cleaner/build/outputs/apk/release/cleaner-release.apk
            adb install cleaner/build/outputs/apk/androidTest/release/cleaner-release-androidTest.apk
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am instrument -w -r -e expectedCandidateSha256 $(sha256sum cleaner/build/outputs/apk/release/cleaner-release.apk | cut -d " " -f 1) -e class com.universalrp.cleansweep.RainForecastDetailsNativeTest com.universalrp.cleansweep.test/androidx.test.runner.AndroidJUnitRunner > rain-native.txt
            cat rain-native.txt
            grep -F 'OK (1 test)' rain-native.txt
            ! grep -E "FAILURES|INSTRUMENTATION_FAILED|Process crashed" rain-native.txt
      - name: Readable bounded failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for p in Path('cleaner/build/test-results').rglob('TEST-*.xml'):
              for f in E.parse(p).getroot().iter('failure'):
                  print('::error::'+str(f.text or f.get('message',''))[:4000].replace('\n','%0A'))
          p=Path('rain-native.txt')
          if p.exists(): print('::error::'+p.read_text()[-10000:].replace('\n','%0A'))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Live-Guard-rain-details-test-evidence-not-an-update
          path: |
            rain-native.txt
            cleaner/build/reports/tests/
            cleaner/build/reports/lint-results-release.html
          retention-days: 14
