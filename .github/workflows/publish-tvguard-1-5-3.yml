name: Publish owner-approved exact TV Guard 1.5.3
on:
  push:
    branches: ["arena/30198928-rp-android-apps"]
    paths: ["docs/tvguard-1.5.3-approval.json"]
permissions: {contents: write, actions: read}
concurrency:
  group: publish-exact-tvguard-1-5-3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify resources and publication code
        run: |
          python3 tools/verify_tvguard_resources.py
          python3 -m unittest discover -s tools/tests -p 'test_publish_tv_safety_candidates.py'
          python3 -m py_compile tools/publish_tvguard_153.py
      - name: Promote only the pinned verified candidate
        run: python3 tools/publish_tvguard_153.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvguard-1.5.3-publication-receipt
          path: ${{ runner.temp }}/tv-safety-publication/tvguard-v1.5.3-publication.json
          retention-days: 30
          if-no-files-found: warn
