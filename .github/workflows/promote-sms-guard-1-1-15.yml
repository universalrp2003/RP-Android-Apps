name: Publish authorized SMS Guard 1.1.15 (exact tested APK)
on:
  push:
    branches: ["arena/45c89326-rp-android-apps"]
    paths: [".github/workflows/promote-sms-guard-1-1-15.yml"]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-authorized-sms-guard-1-1-15
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 71c2cd915a78c45092ae2a7091dfe57e1b603ded
      EXPECTED_SHA: ca6f4e80a7e417c2f86d25ec7f496f120f6f9f0d44525a2b8af04b5bbf4ee01e
      ARCHIVE_SHA: c439fd13ed1e0a2b4c516e176375f65ab9efbb5199b6b17ef381e89e1b13aad0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Wait for the selected source's shared regression build
        run: gh run watch 41214456050 --exit-status --interval 30
      - name: Verify authorization, successful native gates and unchanged compiled inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests
          python3 tools/verify_apps_localization.py
          python3 tools/verify_release_signing_policy.py --fresh-install
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path], text=True))
          source=os.environ['SOURCE']
          approval=pathlib.Path('docs/sms-guard-1.1.15-verification.md').read_text()
          for value in ('Publication authorized: yes', source, os.environ['EXPECTED_SHA'], os.environ['ARCHIVE_SHA'], 'unresolved'):
              assert value in approval, value
          run=api('actions/runs/41214460439'); job=api('actions/jobs/124576009488'); artifact=api('actions/artifacts/13047597952')
          assert (run['head_sha'],run['status'],run['conclusion'],run['path']) == (source,'completed','success','.github/workflows/smsguard-test-apk.yml')
          assert run['head_branch']=='arena/45c89326-rp-android-apps'
          assert job['run_id']==run['id'] and job['conclusion']=='success'
          for name in ('Run repository static & bilingual localization gates','Run SMS Guard unit tests, release lint & assemble signed APK','Verify package, ROLE_SMS manifest, RP Ideas signer & SHA-256','Upload signed SMS Guard Test APK artifact'):
              steps=[s for s in job['steps'] if s['name']==name]
              assert len(steps)==1 and steps[0]['conclusion']=='success', name
          annotations=api('check-runs/124576009488/annotations')
          notice='\n'.join(a['message'] for a in annotations)
          assert 'sha256='+os.environ['EXPECTED_SHA'] in notice and 'bytes=12824500' in notice
          assert 'blob_sha=41b1ba8f235a1ee4f8723c6be3be73260f45cc2b' in notice
          assert artifact['id']==13047597952 and artifact['name']=='SMS-Guard-signed-candidate' and not artifact['expired']
          assert artifact['workflow_run']['id']==run['id'] and artifact['workflow_run']['head_sha']==source
          assert artifact['digest']=='sha256:'+os.environ['ARCHIVE_SHA']
          full=api('actions/runs/41214456050')
          assert full['head_sha']==source and full['status']=='completed' and full['conclusion']=='success'
          subprocess.run(['git','merge-base','--is-ancestor',source,'HEAD'],check=True)
          paths=subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines()
          forbidden=[p for p in paths if (p.startswith(('smsguard/','shared/','gradle/','ci-keystore/')) and p!='smsguard/README.md') or p in {'build.gradle.kts','settings.gradle.kts','gradle.properties','gradlew','gradlew.bat'}]
          assert not forbidden, 'Compiled inputs changed: '+repr(forbidden)
          # A release with this unique tag must not already exist, including drafts.
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp','repos/'+os.environ['GH_REPO']+'/releases?per_page=100'],text=True))
          assert not [r for page in pages for r in page if r['tag_name']=='sms-guard-v1.1.15']
          PY
      - name: Download the pinned candidate archive and verify its exact APK bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/artifacts/13047597952/zip > /tmp/selected-sms.zip
          echo "$ARCHIVE_SHA  /tmp/selected-sms.zip" | sha256sum --check
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile
          with zipfile.ZipFile('/tmp/selected-sms.zip') as z:
              assert z.namelist()==['SMS-Guard-v1.1.15.apk']
              data=z.read('SMS-Guard-v1.1.15.apk')
          assert len(data)==12824500 and hashlib.sha256(data).hexdigest()==os.environ['EXPECTED_SHA']
          pathlib.Path('/tmp/SMS-Guard-v1.1.15.apk').write_bytes(data)
          PY
      - name: Verify manifest, established signer and actual permission delta
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=/tmp/SMS-Guard-v1.1.15.apk
          "$tools/aapt2" dump badging "$apk" > /tmp/sms-badging
          grep -Fq "package: name='com.universalrp.smsguard' versionCode='21' versionName='1.1.15'" /tmp/sms-badging
          grep -Eiq "(sdkVersion|minSdkVersion)[[:space:]]*[:=][[:space:]]*['\"]?26(['\"]|[[:space:]]|$)" /tmp/sms-badging
          ! grep -q application-debuggable /tmp/sms-badging
          ! grep -Eq 'uses-permission.*(REQUEST_INSTALL_PACKAGES|FOREGROUND_SERVICE|BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE|SYSTEM_ALERT_WINDOW)' /tmp/sms-badging
          grep -Fq android.permission.READ_SMS /tmp/sms-badging
          grep -Fq android.permission.RECEIVE_SMS /tmp/sms-badging
          "$tools/apksigner" verify --print-certs "$apk" > /tmp/sms-signer
          signer="$(sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' /tmp/sms-signer | tr -d ' :\r' | tr A-F a-f | sort -u)"
          test "$signer" = 7366d76dc5a9032424f032f1530f661366d880af37657374df85ca7a6299747d
          mkdir /tmp/previous-sms
          gh release download sms-guard-v1.1.11 --pattern SMS-Guard-v1.1.11.apk --dir /tmp/previous-sms
          echo '9fd0aa043eaf261c061b214a27d4427dc73d66eee8a1a23c9dd3697d9f6f0604  /tmp/previous-sms/SMS-Guard-v1.1.11.apk' | sha256sum --check
          "$tools/aapt2" dump badging /tmp/previous-sms/SMS-Guard-v1.1.11.apk > /tmp/previous-sms-badging
          "$tools/apksigner" verify --print-certs /tmp/previous-sms/SMS-Guard-v1.1.11.apk > /tmp/previous-sms-signer
          grep -Fq "$signer" /tmp/previous-sms-signer
          python3 tools/verify_release_permission_delta.py --candidate-badging /tmp/sms-badging --previous-badging /tmp/previous-sms-badging | tee /tmp/sms-permission-delta
          grep -Fxq 'EVIDENCE-REQUIRED: no' /tmp/sms-permission-delta
      - name: Create unique draft, upload selected bytes, re-download by asset ID and publish
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  SMS-Guard-v1.1.15.apk\n' "$EXPECTED_SHA" > /tmp/SMS-Guard-v1.1.15.sha256
          python3 - <<'PY'
          import os,pathlib
          source=os.environ['SOURCE']; base='https://github.com/'+os.environ['GH_REPO']+'/blob/'+source+'/'
          note=pathlib.Path('releases/sms-guard-v1.1.15.md').read_text().replace('(../docs/', '('+base+'docs/').replace('(../PRIVACY.md)', '('+base+'PRIVACY.md)')
          header=(f"**Exact tested APK:** 12,824,500 bytes · SHA-256 `{os.environ['EXPECTED_SHA']}`\n\n"
                  f"**Source:** [`{source}`](https://github.com/{os.environ['GH_REPO']}/tree/{source}) · "
                  f"[Signed tests/lint/verification run](https://github.com/{os.environ['GH_REPO']}/actions/runs/41214460439) · artifact `13047597952`. No rebuild.\n\n")
          pathlib.Path('/tmp/sms-release-notes.md').write_text(header+note)
          PY
          gh release create sms-guard-v1.1.15 /tmp/SMS-Guard-v1.1.15.apk /tmp/SMS-Guard-v1.1.15.sha256 --draft --target "$SOURCE" --title 'SMS Guard (குறுஞ்செய்தி காவலன்) v1.1.15' --notes-file /tmp/sms-release-notes.md
          # Fresh drafts need not be resolvable by /releases/tags yet. Discover the
          # exact authenticated draft once, then use numeric release/asset IDs.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > /tmp/sms-releases.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          pages=json.load(open('/tmp/sms-releases.json'))
          matches=[r for page in pages for r in page if r['tag_name']=='sms-guard-v1.1.15']
          assert len(matches)==1
          release=matches[0]
          assert release['draft'] and not release['prerelease'] and release['target_commitish']==os.environ['SOURCE']
          assert sorted(a['name'] for a in release['assets'])==['SMS-Guard-v1.1.15.apk','SMS-Guard-v1.1.15.sha256']
          asset=next(a for a in release['assets'] if a['name']=='SMS-Guard-v1.1.15.apk')
          assert asset['size']==12824500 and asset['digest']=='sha256:'+os.environ['EXPECTED_SHA']
          data=subprocess.check_output(['gh','api','-H','Accept: application/octet-stream','repos/'+os.environ['GH_REPO']+'/releases/assets/'+str(asset['id'])])
          assert len(data)==12824500 and hashlib.sha256(data).hexdigest()==os.environ['EXPECTED_SHA']
          subprocess.run(['gh','api','-X','PATCH','repos/'+os.environ['GH_REPO']+'/releases/'+str(release['id']),'-F','draft=false'],check=True)
          final=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/releases/'+str(release['id'])],text=True))
          assert not final['draft'] and final['published_at']
          public=next(a for a in final['assets'] if a['name']=='SMS-Guard-v1.1.15.apk')
          assert public['id']==asset['id'] and public['size']==12824500 and public['digest']=='sha256:'+os.environ['EXPECTED_SHA']
          receipt=f"Published exact SMS1.1.15: release={final['id']} asset={asset['id']} bytes=12824500 SHA256={os.environ['EXPECTED_SHA']} published_at={final['published_at']}"
          print('::notice::'+receipt)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(receipt+'\n\nPlay Protect unresolved. No Google clearance or exact-build phone acceptance claimed.\n')
          PY
