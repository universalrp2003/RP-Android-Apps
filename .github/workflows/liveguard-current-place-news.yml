name: Live Guard current-place weather and clear Tamil checks
on:
  push:
    branches: ["arena/4dfa3a21-rp-android-apps"]
    paths: ["cleaner/**", ".github/workflows/liveguard-current-place-news.yml"]
permissions:
  contents: read
concurrency:
  group: liveguard-current-place-news-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: ./.github/actions/prepare-release-signing
        with:
          keystore-base64: ${{ secrets.RP_RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.14.3'}
      - name: Source and localization
        run: |
          python3 -m unittest discover -s tools/tests -q
          python3 tools/verify_apps_localization.py
      - name: Compile app and native tests, execute release JVM and lint
        run: |
          set -o pipefail
          gradle :cleaner:testReleaseUnitTest :cleaner:lintRelease :cleaner:assembleRelease :cleaner:assembleReleaseAndroidTest --no-daemon --stacktrace 2>&1 | tee /tmp/liveguard-check.log
      - name: Surface failures
        if: failure()
        run: |
          python3 tools/report_failing_tests.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/liveguard-check.log')
          if p.exists():
              lines=p.read_text(errors='replace').splitlines()
              for line in [x for x in lines if x.startswith('e: ') or 'Error:' in x or ' FAILED' in x][-25:]:
                  print('::error::'+line.replace('%','%25'))
          PY
