name: Live Guard 2.83 signed upgrade and owner-requested regressions (no publication)
on:
  push:
    branches: ["arena/aaa560d4-rp-android-apps"]
    paths: ["cleaner/**", "shared/**", "tools/inspect_liveguard_283_candidate.py", "tools/liveguard_283_native_smoke.py", ".github/workflows/liveguard-283-candidate.yml"]
permissions:
  contents: read
concurrency:
  group: liveguard-283-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: ./.github/actions/prepare-release-signing
        with:
          keystore-base64: ${{ secrets.RP_RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.14.3'}
      - name: Offline source, bilingual and public-byte guards
        run: |
          python3 -m unittest discover -s tools/tests -q
          python3 tools/verify_apps_localization.py
          python3 tools/verify_cleaner_localization.py
          python3 tools/verify_release_signing_policy.py --fresh-install
      - name: JVM regressions, lint and signed Live Guard candidate only
        run: |
          set -o pipefail
          gradle :cleaner:testReleaseUnitTest :cleaner:lintRelease :cleaner:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/liveguard-283-build.log"
      - name: Surface compiler, JVM and lint failures in readable annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def report(text):
              print('::error title=Live Guard 2.83 diagnostic::'+text[-16000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          p=Path(os.environ['RUNNER_TEMP'])/'liveguard-283-build.log'
          if p.exists():
              lines=p.read_text(errors='replace').splitlines()
              errors=[line for line in lines if line.startswith('e: ') or 'error:' in line.lower() or ' FAILED' in line or 'What went wrong' in line]
              report('\n'.join(errors) if errors else '\n'.join(lines[-80:]))
          for p in Path('cleaner/build/test-results').glob('**/TEST-*.xml'):
              for failure in ET.parse(p).getroot().findall('.//failure'):
                  report(str(p)+'\n'+failure.get('message','')+'\n'+(failure.text or '')[:4000])
          PY
      - name: All required release regressions actually ran, no missing/skipped suites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.verify_cleaner_regressions import verify
          for summary in verify(Path('cleaner/build/test-results'), variants=('Release',)):
              print(summary)
          PY
      - name: Exact identity, signer and full merged permission continuity
        run: python3 tools/inspect_liveguard_283_candidate.py
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Same-key 2.82 update, saved data and native settings
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: |
            python3 tools/battery_voice_update_smoke.py cleaner
            python3 tools/liveguard_283_native_smoke.py
      - name: Remove baseline from candidate download
        run: rm "${RUNNER_TEMP}/health-cleaner/CleanSweep-v2.82.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: Live-Guard-2.83-signed-tested-candidate
          path: ${{ runner.temp }}/health-cleaner/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Live-Guard-2.83-regression-failures
          path: |
            cleaner/build/reports/tests/
            cleaner/build/reports/lint-results-release.html
          retention-days: 7
