name: Live Guard 3.02 candidate verification (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: liveguard-302-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Require only version changes to owner-tested app inputs
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          source = '55ca2fdb5c6eaeb8d44925d682fbe6b782d992ee'
          paths = subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines()
          protected = [p for p in paths if p.startswith(('cleaner/src/main/','shared/','gradle/','ci-keystore/')) or p in ('build.gradle.kts','settings.gradle.kts','gradle.properties')]
          assert not protected, protected
          old = subprocess.check_output(['git','show',source+':cleaner/build.gradle.kts'],text=True)
          expected = old.replace('versionCode = 106','versionCode = 107').replace('versionName = "3.01"','versionName = "3.02"')
          assert Path('cleaner/build.gradle.kts').read_text() == expected
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - uses: ./.github/actions/prepare-release-signing
        with:
          keystore-base64: ${{ secrets.RP_RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
      - name: Verify source, localization and Python tests
        run: |
          python3 tools/verify_cleaner_localization.py
          python3 tools/verify_cleaner_core_manifest.py
          python3 -m unittest discover -s tools/tests -q
      - name: Run release tests and build signed APKs
        run: |
          set -o pipefail
          gradle :cleaner:testReleaseUnitTest :cleaner:lintRelease :cleaner:assembleRelease :cleaner:assembleReleaseAndroidTest --no-daemon --stacktrace 2>&1 | tee /tmp/liveguard302-build.log
      - name: Check regression suites, version, signing identity and candidate digest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('cleaner/build/test-results/testReleaseUnitTest').glob('TEST-*.xml'))
          required = ['NewsCompletedStoriesTest','NewsStrictVoiceCacheTest','NewsVoicePersistenceTest','NewsVoiceRotationTest','WeatherPresentationPolicyTest','AppUsageHistoryPolicyTest','AppStorageSizePolicyTest']
          for name in required:
              match = [p for p in files if name in p.name]
              assert len(match)==1, name
              root=ET.parse(match[0]).getroot()
              assert int(root.get('tests','0'))>0 and root.get('failures')=='0' and root.get('errors')=='0' and root.get('skipped')=='0', name
          total=sum(int(ET.parse(p).getroot().get('tests','0')) for p in files)
          print('::notice title=3.02 JVM tests::'+str(total)+' tests; seven focused suites executed with zero skips')
          PY
          mkdir -p /tmp/liveguard302-candidate
          cp cleaner/build/outputs/apk/release/*.apk /tmp/liveguard302-candidate/candidate.apk
          cp cleaner/build/outputs/apk/androidTest/release/*.apk /tmp/liveguard302-candidate/test.apk
          sha256sum /tmp/liveguard302-candidate/candidate.apk | awk '{print $1}' > /tmp/liveguard302-candidate/sha256.txt
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/aapt" dump badging /tmp/liveguard302-candidate/candidate.apk > /tmp/liveguard302-candidate/badging.txt
          grep -q "package: name='com.universalrp.cleansweep' versionCode='107' versionName='3.02'" /tmp/liveguard302-candidate/badging.txt
          ! grep -q application-debuggable /tmp/liveguard302-candidate/badging.txt
          "$tools/apksigner" verify --print-certs /tmp/liveguard302-candidate/candidate.apk > /tmp/liveguard302-candidate/signer.txt
          grep -qi 'certificate SHA-256 digest: 7366d76dc5a9032424f032f1530f661366d880af37657374df85ca7a6299747d' /tmp/liveguard302-candidate/signer.txt
          echo "::notice title=3.02 candidate SHA-256::$(cat /tmp/liveguard302-candidate/sha256.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: liveguard-3.02-verified-candidate
          path: /tmp/liveguard302-candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Surface build errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/liveguard302-build.log')
          if p.exists():
              lines=[x for x in p.read_text(errors='replace').splitlines() if x.startswith('e: ') or ' FAILED' in x or 'What went wrong' in x or 'Error:' in x]
              if lines: print('::error title=3.02 build::'+'\n'.join(lines[-40:])[-7000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
  upgrade:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        baseline: [published, owner-candidate]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASELINE_SHA: ${{ matrix.baseline == 'published' && 'b5850343f4788d9c499024da8ea53b534a20e317bf57b071d855e565a360174f' || '728aa70bcb207b136181af8ecc844faae62a46fa5cbb31172736c1a61bad29d5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: liveguard-3.02-verified-candidate, path: /tmp/liveguard302-candidate}
      - uses: actions/download-artifact@v4
        if: matrix.baseline == 'owner-candidate'
        with:
          name: cleansweep-apk
          path: /tmp/liveguard301-owner
          run-id: 45654422718
          github-token: ${{ github.token }}
      - name: Prepare the appropriate baseline and exact candidate
        run: |
          set -euo pipefail
          if [ '${{ matrix.baseline }}' = 'published' ]; then
            mkdir -p /tmp/liveguard301-public
            gh release download live-guard-v3.01 --pattern CleanSweep-v3.01.apk --dir /tmp/liveguard301-public
            cp /tmp/liveguard301-public/CleanSweep-v3.01.apk /tmp/liveguard302-baseline.apk
          else
            mapfile -t old < <(find /tmp/liveguard301-owner -path '*/release/*.apk')
            test "${#old[@]}" = 1
            cp "${old[0]}" /tmp/liveguard302-baseline.apk
          fi
          echo "$BASELINE_SHA  /tmp/liveguard302-baseline.apk" | sha256sum -c -
          mkdir -p cleaner/build/outputs/apk/release cleaner/build/outputs/apk/androidTest/release
          cp /tmp/liveguard302-candidate/candidate.apk cleaner/build/outputs/apk/release/candidate.apk
          cp /tmp/liveguard302-candidate/test.apk cleaner/build/outputs/apk/androidTest/release/test.apk
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify exact candidate upgrade and native checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -o pipefail -c 'python3 tools/run_liveguard_302_upgrade.py 2>&1 | tee /tmp/liveguard302-upgrade.log'
      - name: Surface upgrade errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/liveguard302-upgrade.log')
          if p.exists(): print('::error title=3.02 upgrade::'+'\n'.join(p.read_text(errors='replace').splitlines()[-60:])[-7000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
