name: Inspect synthetic Daily Vault emulator evidence
on:
  push:
    branches: ["arena/bb783762-rp-android-apps"]
    paths: [".github/workflows/dailyvault-qa-evidence.yml"]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 41089305476
          name: dailyvault-release-emulator-evidence
          path: evidence
      - name: Surface synthetic UI evidence through bounded annotations
        shell: python
        run: |
          import base64, pathlib
          path = pathlib.Path('evidence/failure.png')
          data = base64.b64encode(path.read_bytes()).decode()
          chunks = [data[i:i+3800] for i in range(0, len(data), 3800)]
          for i, chunk in enumerate(chunks):
              print(f'::notice title=DVQA PNG {i+1} of {len(chunks)}::{chunk}')
          import json, xml.etree.ElementTree as ET
          root = ET.parse('evidence/last-ui.xml')
          items = [{k:n.get(k) for k in ('text','content-desc','bounds','clickable')} for n in root.iter('node') if n.get('clickable') == 'true' or n.get('content-desc')]
          print('::notice title=DVQA controls::' + json.dumps(items, ensure_ascii=False))
