name: Deploy Official Website to GitHub Pages

on:
  push:
    branches:
      - main
      - "arena/**"
    # Package only actual site inputs. APK/source/docs-only pushes otherwise create
    # another ~1.46 GB Pages artifact without changing the website. Publication must
    # still update the pinned site/workflow receipts; dispatch remains available.
    paths:
      - "site/**"
      - "tools/build_store_catalog.py"
      - "tamilanstore/src/main/assets/catalog.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check website and catalog contracts before packaging
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_website*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_store_live_catalog.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_fresh_install_migration.py' -v

