name: Deploy Official Website to GitHub Pages

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check & Setup GitHub Pages
        id: pages_setup
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Guide if GitHub Pages is not enabled yet in Repo Settings
        if: steps.pages_setup.outcome != 'success'
        run: |
          echo "### Action needed once in GitHub Settings -> Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "Open **Settings -> Pages -> Build and deployment -> Source** and select **GitHub Actions**, then re-run this workflow or merge to \`main\` to publish \`https://universalrp2003.github.io/RP-Android-Apps/\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload site artifact
        if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: steps.pages_setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
