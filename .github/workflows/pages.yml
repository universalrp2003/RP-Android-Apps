name: Deploy Official Website to GitHub Pages

on:
  push:
    branches:
      - main
      - "arena/**"
    # Package only actual site inputs. APK/source/docs-only pushes otherwise create
    # another ~1.46 GB Pages artifact without changing the website. Publication must
    # still update the pinned site/workflow receipts; dispatch remains available.
    paths:
      - "site/**"
      - "tools/build_store_catalog.py"
      - "tamilanstore/src/main/assets/catalog.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check website and catalog contracts before packaging
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_website*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_store_live_catalog.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_fresh_install_migration.py' -v

      - name: Fetch official signed APKs, verify SHA-256, and build .apk + .zip CDN mirrors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/apks
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile

          RELEASES = [
              # Retention rule: the current release of every app. Historical releases are
              # byte-checked at GitHub instead of duplicated in the Pages artifact. The Pages artifact is capped at 1 GB, so older
              # builds stay on their GitHub release page instead of being mirrored a second time.
              ("live-guard-v3.00", "CleanSweep-v3.00.apk", 14781579, "286f172054f0a9b10a16d673f49acff1a3bac3d8b3686c9ddf65c27b2b2a5940"),
              ("tamilan-store-v0.12", "Tamilan-Store-v0.12.apk", 19476375, "29ad4b2a8b3dc575ef2e6707bc81e27dcfc0541a69bfef350f1a83ddd4298cce"),
              ("voice-notes-v1.3.4", "Voice-Notes-v1.3.4.apk", 13135195, "1aa2ea8eb1037098881ce4a0a4329b6164f77a77e0ab31112610fa2d03f8094a"),
              ("secret-message-v1.1.3", "Secret-Message-v1.1.3.apk", 29460361, "2a3baf666490bec882a7f6ff85e5080a72e6c57f2c92e527601a7aca3216007c"),
              ("sms-guard-v1.1.17", "SMS-Guard-v1.1.17.apk", 12840884, "b9a7befd1e2c2b3afac8272994f374efdf92fa2151b6d4b624e25168566cd8dd"),
              ("vasanthi-ai-v1.1.5", "Vasanthi-AI-v1.1.5.apk", 45777962, "4b3c98a446f040d5e754eeee22065412ec1e6e756bf427001418e3b100182fa6"),
              ("oor-arivippu-v1.1.21", "Oor-Arivippu-v1.1.21.apk", 12924720, "e65e1bdbabebc89edbe994894eb1554ce1c7583b8cdb8940aaf0eee054975258"),
              ("tamil-podcast-v1.6", "Tamil-Podcast-Player-v1.6.apk", 11967239, "f654c5966d59daf5ff1489e503f97db53e20e202c93eacee91cb5b12597e04ec"),
              ("daily-vault-v0.5", "DailyVault-v0.5.apk", 11712552, "8842606659442a1e2b8c7d28fd2affac56bb40c0bc679acf86785f3167903d55"),
              ("expense-tracker-v1.2", "Expense-Tracker-v1.2.apk", 11564299, "286ea8027042b014fb2f8a28198ee01b569eb270577993189c2f5d7be3277108"),
              ("elderly-launcher-v1.7", "Elderly-Launcher-v1.7.apk", 11521755, "13ce20550e9493f6492a399e5bfad72d8fdd95af9e7d0838b7fd0219f543bfec"),
              ("ramesh-radio-v1.31", "Ramesh-Radio-v1.31.apk", 15179972, "fceac7c50758990eaa33228a3ec375f38fb9a307bca8452566eb84d037a5dc22"),
              ("pulseeq-v1.11", "PulseEQ-v1.11.apk", 12165793, "bcfb6a606d831ad935efe024bae4960ed33ececcb67157ae408f57c596c43e4a"),
              ("rp-vocal-remover-studio-v0.1.16", "RP-Vocal-Remover-Studio-v0.1.16.apk", 65163821, "6d0b04cd63f18bcb82bd2512d71c0985737268752007d96ccc4327558d38489e"),
              ("tvguard-v1.5.1", "Android-TV-Guard-v1.5.1.apk", 11797331, "aea1ae03d2bfe87ee0659cd2cba8104e22365c1c18391587d9ae7b70cae3614b"),
              ("system-app-disabler-v0.1.0", "System-App-Disabler-v0.1.0.apk", 11635233, "48b94498d1740e6a7276b73d33c8508c65604d4e86d223d0df956db376291ae4"),
          ]

          out_dir = pathlib.Path("site/apks")
          for tag, apk_name, expected_size, expected_sha in RELEASES:
              url = f"https://github.com/universalrp2003/RP-Android-Apps/releases/download/{tag}/{apk_name}"
              apk_path = out_dir / apk_name
              urllib.request.urlretrieve(url, apk_path)
              data = apk_path.read_bytes()
              actual_sha = hashlib.sha256(data).hexdigest()
              assert len(data) == expected_size, f"Size mismatch for {apk_name}: {len(data)} != {expected_size}"
              assert actual_sha == expected_sha, f"SHA-256 mismatch for {apk_name}: {actual_sha} != {expected_sha}"

              # Create zero-overhead store ZIP package (.zip bypasses Android browser .apk FUSE/SafeBrowsing 100% hang)
              zip_name = apk_name[:-4] + ".zip"
              zip_path = out_dir / zip_name
              with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_STORED) as zf:
                  zf.writestr(apk_name, data)
              print(f"VERIFIED CDN MIRROR: {apk_name} ({expected_size:,} B) + {zip_name} ({zip_path.stat().st_size:,} B)")
          # Each release is stored twice (the .apk and a byte-identical stored .zip), so the
          # deploy size is roughly double. upload-pages-artifact compresses the archive and the
          # hard limit is 1 GB, so hold the mirror well below it and prune instead of growing.
          mirrored = 2 * sum((out_dir / apk_name).stat().st_size for _, apk_name, _, _ in RELEASES)
          MIRROR_BUDGET = 800_000_000
          assert mirrored <= MIRROR_BUDGET, f"Site mirror budget exceeded: {mirrored:,} B > {MIRROR_BUDGET:,} B; prune an older mirror"
          print(f"Site mirror budget: {mirrored:,} B of {MIRROR_BUDGET:,} B across {len(RELEASES)} releases")
          PY

      - name: Verify Google Search Console meta tag, HTML file, CDN APKs/ZIPs & sitemap exist
        run: |
          grep -Fq 'ZxgKHtiCt5dwTUFnjnuAgb8qQXJPrKwlK--Wf-bfDy4' site/index.html
          test -f site/google07eb97f28234915c.html
          test -f site/sitemap.xml
          test -f site/robots.txt
          test -s site/apks/CleanSweep-v3.00.apk
          test -s site/apks/CleanSweep-v3.00.zip
          test -s site/apks/Android-TV-Guard-v1.5.1.apk
          test -s site/apks/Android-TV-Guard-v1.5.1.zip
          test -s site/apks/System-App-Disabler-v0.1.0.apk
          test -s site/apks/System-App-Disabler-v0.1.0.zip
          test -s site/apks/Tamilan-Store-v0.12.apk
          test -s site/apks/Tamilan-Store-v0.12.zip
          test -s site/apks/Voice-Notes-v1.3.4.apk
          test -s site/apks/Voice-Notes-v1.3.4.zip
          test -s site/apks/Secret-Message-v1.1.3.apk
          test -s site/apks/Secret-Message-v1.1.3.zip
          test -s site/apks/SMS-Guard-v1.1.17.apk
          test -s site/apks/SMS-Guard-v1.1.17.zip
          test -s site/apks/Vasanthi-AI-v1.1.5.apk
          test -s site/apks/Vasanthi-AI-v1.1.5.zip
          test -s site/apks/Oor-Arivippu-v1.1.21.apk
          test -s site/apks/Oor-Arivippu-v1.1.21.zip
          test -s site/apks/Tamil-Podcast-Player-v1.6.apk
          test -s site/apks/Tamil-Podcast-Player-v1.6.zip
          test -s site/apks/DailyVault-v0.5.apk
          test -s site/apks/DailyVault-v0.5.zip
          test -s site/apks/Expense-Tracker-v1.2.apk
          test -s site/apks/Expense-Tracker-v1.2.zip
          test -s site/apks/Elderly-Launcher-v1.7.apk
          test -s site/apks/Elderly-Launcher-v1.7.zip
          test -s site/apks/Ramesh-Radio-v1.31.apk
          test -s site/apks/Ramesh-Radio-v1.31.zip
          test -s site/apks/PulseEQ-v1.11.apk
          test -s site/apks/PulseEQ-v1.11.zip
          test -s site/apks/RP-Vocal-Remover-Studio-v0.1.16.apk
          test -s site/apks/RP-Vocal-Remover-Studio-v0.1.16.zip

      - name: Build live official Store catalog from public release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/build_store_catalog.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    # deploy-pages enforces a 10-minute maximum. Reserve a separate 10-minute
    # window for strict post-deployment metadata and signed-download checks.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000 # Upstream maximum: 10 minutes; never skip checks on timeout.
      - name: Verify deployed metadata, nine exact public APK/ZIP downloads and safe Launcher screenshots
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/verify_live_three_releases.py
