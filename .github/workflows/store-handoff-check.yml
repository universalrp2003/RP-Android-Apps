name: Store handoff migration checks (no publication)
on:
  push:
    branches: ["arena/6d87e1ec-rp-android-apps"]
    paths:
      - "shared/src/main/java/com/universalrp/updates/**"
      - "cleaner/**"
      - "radio/**"
      - "vocalremover/**"
      - "oorarivippu/**"
      - "smsguard/**"
      - "vasanthi/**"
      - "expensetracker/**"
      - "dailyvault/**"
      - "voicenotes/**"
      - "tools/verify_store_handoff_policy.py"
      - ".github/workflows/store-handoff-check.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: handoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        module: [cleaner, radio, vocalremover, oorarivippu, smsguard, vasanthi, expensetracker, dailyvault, voicenotes]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Reject local installers and validate Store trust gates
        run: python3 tools/verify_store_handoff_policy.py
      - name: Deterministic tests, lint and build (no public release)
        shell: bash
        run: |
          set -o pipefail
          gradle :${{ matrix.module }}:testDebugUnitTest :${{ matrix.module }}:lintDebug :${{ matrix.module }}:assembleDebug --no-daemon --stacktrace 2>&1 | tee handoff-build.log
      - name: Surface compiler, unit and lint failures as bounded annotations
        if: failure()
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          def report(text):
              print('::error title=${{ matrix.module }} validation::' + text[:900].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          log = pathlib.Path('handoff-build.log')
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  if line.startswith('e:') or 'Execution failed for task' in line: report(line)
          seen = set()
          for file in pathlib.Path('${{ matrix.module }}/build').rglob('*.xml'):
              if '/reports/' not in str(file) and '/test-results/' not in str(file): continue
              try: root = ET.parse(file).getroot()
              except ET.ParseError: continue
              for issue in root.findall('issue'):
                  if issue.get('severity') not in ('Error', 'Fatal'): continue
                  location = issue.find('location')
                  key = (issue.get('id'), str(location.attrib if location is not None else {}))
                  if key in seen: continue
                  seen.add(key)
                  report(str(key) + ': ' + issue.get('message', ''))
              for failure in root.findall('.//failure') + root.findall('.//error'):
                  report(str(file) + ': ' + failure.get('message', ''))
      - name: Inspect actual merged APK for retired installer capability
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk="$(find '${{ matrix.module }}/build/outputs/apk/debug' -maxdepth 1 -name '*.apk' | head -1)"
          test -s "$apk"
          "$tools/aapt" dump permissions "$apk" > /tmp/handoff-permissions.txt
          if grep -Eq 'android.permission.(REQUEST_INSTALL_PACKAGES|INSTALL_PACKAGES)' /tmp/handoff-permissions.txt; then
            echo '::error::Merged APK retained installer permission'; exit 1
          fi
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/handoff-manifest.txt
          if grep -q '\.updates\.files' /tmp/handoff-manifest.txt; then
            echo '::error::Merged APK retained update provider'; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-${{ matrix.module }}-reports
          path: |
            ${{ matrix.module }}/build/reports/
            ${{ matrix.module }}/build/test-results/
          retention-days: 14
