name: Store handoff migration checks (no publication)
on:
  push:
    branches: ["arena/6d87e1ec-rp-android-apps"]
    paths:
      - "shared/src/main/java/com/universalrp/updates/**"
      - "cleaner/**"
      - "radio/**"
      - "vocalremover/**"
      - "oorarivippu/**"
      - "smsguard/**"
      - "vasanthi/**"
      - "expensetracker/**"
      - "dailyvault/**"
      - "tools/verify_store_handoff_policy.py"
      - ".github/workflows/store-handoff-check.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: handoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[read-handoff-reports]') }}
    strategy:
      fail-fast: false
      matrix:
        module: [cleaner, radio, vocalremover, oorarivippu, smsguard, vasanthi, expensetracker, dailyvault]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Reject local installers and validate Store trust gates
        run: python3 tools/verify_store_handoff_policy.py
      - name: Deterministic tests, lint and build (no public release)
        shell: bash
        run: |
          set -o pipefail
          gradle :${{ matrix.module }}:testDebugUnitTest :${{ matrix.module }}:lintDebug :${{ matrix.module }}:assembleDebug --no-daemon --stacktrace 2>&1 | tee handoff-build.log
      - name: Surface compiler diagnostics without unrestricted log downloads
        if: failure()
        run: |
          grep -E '^e:|error:|Execution failed for task' handoff-build.log | head -30 | while read -r line; do
            echo "::error title=${{ matrix.module }} build::$line"
          done

      - name: Inspect actual merged APK for retired installer capability
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk="$(find '${{ matrix.module }}/build/outputs/apk/debug' -maxdepth 1 -name '*.apk' | head -1)"
          test -s "$apk"
          "$tools/aapt" dump permissions "$apk" > /tmp/handoff-permissions.txt
          if grep -Eq 'android.permission.(REQUEST_INSTALL_PACKAGES|INSTALL_PACKAGES)' /tmp/handoff-permissions.txt; then
            echo '::error::Merged APK retained installer permission'; exit 1
          fi
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/handoff-manifest.txt
          if grep -q '\.updates\.files' /tmp/handoff-manifest.txt; then
            echo '::error::Merged APK retained update provider'; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-${{ matrix.module }}-reports
          path: |
            ${{ matrix.module }}/build/reports/
            ${{ matrix.module }}/build/test-results/
          retention-days: 14

  previous_reports:
    strategy:
      fail-fast: false
      matrix:
        module: [cleaner, radio, vocalremover, oorarivippu, vasanthi, expensetracker]
    if: contains(github.event.head_commit.message, '[read-handoff-reports]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40670992298
          name: handoff-${{ matrix.module }}-reports
          path: diagnostics
      - name: Publish existing lint and unit failures as bounded annotations
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          count = 0
          seen = set()
          for file in pathlib.Path('diagnostics').rglob('*.xml'):
              try: root = ET.parse(file).getroot()
              except ET.ParseError: continue
              for issue in root.findall('issue'):
                  if issue.get('severity') not in ('Error', 'Fatal'): continue
                  key = (issue.get('id'), issue.find('location').get('file') if issue.find('location') is not None else '')
                  if key in seen: continue
                  seen.add(key)
                  location = issue.find('location')
                  text = str(file) + ': ' + issue.get('id', '') + ': ' + issue.get('message', '') + ' LOCATION=' + str(location.attrib if location is not None else {})
                  print('::error title=Recorded lint failure::' + text[:900].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
                  count += 1
              for failure in root.findall('.//failure') + root.findall('.//error'):
                  text = str(file) + ': ' + failure.get('message', '')
                  print('::error title=Recorded unit failure::' + text[:900].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
                  count += 1
          print('::notice title=Report diagnostics::Recorded failure count=' + str(count))
