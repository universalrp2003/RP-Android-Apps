name: Publish owner-approved Launcher 1.7 (exact bytes, no rebuild)
on:
  push:
    branches: ["arena/485365dd-rp-android-apps"]
    paths: ["docs/launcher-1.7-owner-acceptance.md"]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-exact-launcher-1-7
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Source and promotion guards
        run: |
          python3 -m unittest discover -s tools/tests -q
          python3 tools/verify_apps_localization.py
          python3 tools/verify_release_signing_policy.py --fresh-install
          python3 -m py_compile tools/promote_verified_launcher_17.py
      - name: Verify exact artifact, identity, signer, permissions; publish once and re-download
        run: python3 tools/promote_verified_launcher_17.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: launcher17-exact-publication-receipt
          path: ${{ runner.temp }}/launcher17-publication-receipt.json
          retention-days: 30
          if-no-files-found: warn
