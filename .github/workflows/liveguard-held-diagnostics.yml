name: Held Live Guard native failure diagnostics (read only)
on:
  push:
    branches: ["arena/d8c51dc7-rp-android-apps"]
    paths: [".github/workflows/liveguard-held-diagnostics.yml"]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Arena cannot reach the artifact/log blob host. Read synthetic test XML
      # on the existing GitHub runner and expose bounded diagnostics, not APKs.
      - name: Inspect exact failed private run, no build or publication
        run: |
          gh run download 41446585626 --name Live-Guard-2.89-regression-failures --dir "$RUNNER_TEMP/failure"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path(os.environ['RUNNER_TEMP'],'failure').rglob('*.xml'):
              try: root=ET.parse(p).getroot()
              except ET.ParseError: continue
              for c in root.iter('testcase'):
                  for kind in ('failure','error'):
                      f=c.find(kind)
                      if f is not None:
                          text=(str(p.relative_to(Path(os.environ['RUNNER_TEMP'],'failure')))+' '+c.get('classname','')+'.'+c.get('name','')+'\n'+f.get('message','')+'\n'+(f.text or ''))[:12000]
                          print('::notice title=Prior native diagnostic::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
