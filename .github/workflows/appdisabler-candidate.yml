name: System App Disabler Candidate APK Build

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "appdisabler/**"
      - ".github/workflows/appdisabler-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: appdisabler-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package System App Disabler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare owner-backed fresh-install signer
        uses: ./.github/actions/prepare-release-signing
        with:
          keystore-base64: ${{ secrets.RP_RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Test and assemble System App Disabler
        shell: bash
        run: |
          set -o pipefail
          gradle :appdisabler:testDebugUnitTest :appdisabler:lintDebug :appdisabler:assembleDebug :appdisabler:assembleRelease --no-daemon --stacktrace 2>&1 | tee appdisabler-build.log

      - name: Ensure emulator-only lab cannot ship in release
        run: python3 tools/verify_disabler_lab_is_debug_only.py

      - name: Expose actionable compiler and lint errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path("appdisabler-build.log"), *Path("appdisabler/app/build/reports").glob("lint-results-*.txt")]
          found = []
          for path in paths:
              if not path.exists(): continue
              for line in path.read_text(errors="replace").splitlines():
                  if re.search(r"error:|FAILED|Execution failed", line, re.I):
                      found.append(f"{path}: {line.strip()}")
          if found:
              print("\n".join(found[-80:]))
              Path("ci-build-failure.md").write_text("\n".join(found[-80:]))
          else:
              print("No specific errors extracted")
              if Path("appdisabler-build.log").exists():
                  print("--- tail appdisabler-build.log ---")
                  print("\n".join(Path("appdisabler-build.log").read_text(errors="replace").splitlines()[-200:]))
                  Path("ci-build-failure.md").write_text("\n".join(Path("appdisabler-build.log").read_text(errors="replace").splitlines()[-200:]))
          PY

      - name: Commit build log to ci-logs for debugging (bypass blob TLS block)
        if: failure()
        run: |
          set -e
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          mkdir -p ci-logs
          TS=$(date +%Y%m%d-%H%M%S)
          LOG="ci-logs/appdisabler-candidate-$TS.log"
          if [ -f appdisabler-build.log ]; then cp appdisabler-build.log "$LOG"; else echo "no appdisabler-build.log" > "$LOG"; fi
          if [ -f ci-build-failure.md ]; then cp ci-build-failure.md "ci-logs/appdisabler-candidate-$TS-failure.md"; fi
          # Also capture lint reports if any
          if ls appdisabler/app/build/reports/lint-results-*.txt 1>/dev/null 2>&1; then cp appdisabler/app/build/reports/lint-results-*.txt ci-logs/ 2>/dev/null || true; fi
          git add ci-logs/
          git commit -m "ci: capture appdisabler candidate failure log $TS [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appdisabler-build-failure
          path: |
            appdisabler-build.log
            appdisabler/app/build/reports/
            ci-build-failure.md
          retention-days: 14

      - name: Upload candidate APK on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: appdisabler-0.3.0-debug-only
          path: |
            appdisabler/app/build/outputs/apk/debug/*.apk
            appdisabler/app/build/test-results/
          retention-days: 14
      # The debuggable debug variant is only for a quick owner install. Anything published
      # publicly must be the release variant: same source, release key, not debuggable.
      - name: Upload non-debuggable release candidate on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: appdisabler-0.3.0-release-candidate
          path: appdisabler/app/build/outputs/apk/release/*.apk
          retention-days: 14

      # The release APK's own SHA-256 is what the publisher, the site and every catalog must pin.
      # It is recorded here because the authoring sandbox cannot download the artifact archive.
      - name: Record the release APK digest
        if: success()
        run: |
          set -euo pipefail
          APK=$(ls appdisabler/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p docs
          {
            echo "# System App Disabler latest build digest (NOT the owner-tested pin)"
            echo
            echo "Written by \`.github/workflows/appdisabler-candidate.yml\`; do not edit by hand."
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| run | ${GITHUB_RUN_ID} |"
            echo "| commit | ${GITHUB_SHA} |"
            echo "| artifact | appdisabler-0.3.0-release-candidate |"
            echo "| apk | $(basename "$APK") |"
            echo "| bytes | $(stat -c %s "$APK") |"
            echo "| apk_sha256 | $(sha256sum "$APK" | cut -d' ' -f1) |"
            echo "| archive_sha256 | (read from the Actions artifact API; not the APK) |"
            echo
            echo "A publisher must pin \`apk_sha256\` above. \`archive_sha256\` is the ZIP GitHub"
            echo "stores for the artifact and is a different value."
          } > docs/appdisabler-candidate-build-digest.md
          cat docs/appdisabler-candidate-build-digest.md

      - name: Commit the digest for the publisher to pin
        if: success()
        run: |
          set -e
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add docs/appdisabler-candidate-build-digest.md
          git commit -m "CI: record System App Disabler 0.2.0 release APK digest (run ${GITHUB_RUN_ID}) [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME} || true
