name: Inspect TV Guard Shizuku candidate receipt (no publication)
on:
  push:
    branches: ["arena/30198928-rp-android-apps"]
    paths: [".github/workflows/inspect-tvguard-shizuku-candidate.yml"]
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
    steps:
      - name: Retrieve tested signed candidate without rebuilding
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          gh run download 45558877424 --name tvguard-1.5.3-stable-signed-tested-candidate --dir "$RUNNER_TEMP/verified"
      - name: Verify candidate and report receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'verified'
          apk = root / 'Android-TV-Guard-1.5.3-signed-candidate.apk'
          receipt = json.loads((root / 'verification.json').read_text())
          digest = hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest()
          assert digest == receipt['apkSha256'] == '1d7452ce651551c1e1fd5c4a4dcc73764a6f317ac58a1d69cb71bd9e719ac3c1'
          assert apk.stat().st_size == receipt['apkBytes']
          assert receipt['sourceCommit'] == '96c7885fcfaf220e28d40418e6bd973ba46cc1ca'
          assert receipt['package'] == 'com.universalrp.tvguard' and receipt['versionName'] == '1.5.3' and receipt['versionCode'] == 10
          assert receipt['workflowRun'] == '45558877424' and receipt['exactCandidateInstalledAndTested'] is True and receipt['published'] is False
          assert (root / 'Android-TV-Guard-1.5.3-signed-candidate.sha256').read_text().split()[0] == digest
          print('::notice title=Exact unpublished candidate receipt::' + json.dumps(receipt, separators=(',', ':')))
          PY
