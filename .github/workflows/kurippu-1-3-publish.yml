name: Publish verified Kurippu 1.3
on:
  push:
    branches: ["arena/30198928-rp-android-apps"]
    paths: ["docs/kurippu/approved-1.3.json"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kurippu-publish-1-3
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/arena/30198928-rp-android-apps'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kurippu-1.3-candidate
          run-id: 45844938407
          github-token: ${{ github.token }}
          path: /tmp/kurippu-release
      - name: Verify exact signed tested bytes and publish
        run: |
          set -euo pipefail
          python3 tools/publish_kurippu_1_3.py
