name: Live Guard 2.95 compact signal pill, honest serving cell and steadier startup regressions (candidate only)
on:
  push:
    branches: ["arena/7d673ac8-rp-android-apps"]
    paths: ["cleaner/**", "shared/**", "tools/inspect_liveguard_295_candidate.py", "tools/liveguard_283_native_smoke.py", "tools/verify_liveguard_295_installed.py", "tools/run_liveguard_295_native.py", "tools/verify_liveguard_295_native.py", ".github/workflows/liveguard-295-candidate.yml"]
permissions:
  contents: read
concurrency:
  group: liveguard-295-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: ./.github/actions/prepare-release-signing
        with:
          keystore-base64: ${{ secrets.RP_RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RP_RELEASE_KEYSTORE_PASSWORD }}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.14.3'}
      - name: Offline source, bilingual and public-byte guards
        run: |
          set -o pipefail
          (
            python3 -m unittest discover -s tools/tests -q &&
            python3 tools/verify_apps_localization.py &&
            python3 tools/verify_cleaner_localization.py &&
            python3 tools/verify_release_signing_policy.py --fresh-install
          ) 2>&1 | tee "$RUNNER_TEMP/liveguard-source.log"
      - name: JVM regressions, lint and signed Live Guard candidate only
        run: |
          set -o pipefail
          gradle :cleaner:testReleaseUnitTest :cleaner:lintRelease :cleaner:assembleRelease :cleaner:assembleReleaseAndroidTest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/liveguard-295-build.log"
      - name: Surface compiler, JVM and lint failures in readable annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def report(text):
              print('::error title=Live Guard 2.95 diagnostic::'+text[-16000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          source_log=Path(os.environ['RUNNER_TEMP'])/'liveguard-source.log'
          if source_log.exists(): report('\n'.join(source_log.read_text(errors='replace').splitlines()[-80:]))
          p=Path(os.environ['RUNNER_TEMP'])/'liveguard-295-build.log'
          if p.exists():
              lines=p.read_text(errors='replace').splitlines()
              errors=[line for line in lines if line.startswith('e: ') or 'error:' in line.lower() or ' FAILED' in line or 'What went wrong' in line]
              report('\n'.join(errors) if errors else '\n'.join(lines[-80:]))
              # Include the actual cause when failure happens before any compiler/test output.
              for index, line in enumerate(lines):
                  if '* What went wrong:' in line:
                      report('\n'.join(lines[index:index+70]))
                      break
          for p in Path('cleaner/build/test-results').glob('**/TEST-*.xml'):
              for failure in ET.parse(p).getroot().findall('.//failure'):
                  report(str(p)+'\n'+failure.get('message','')+'\n'+(failure.text or '')[:4000])
          PY
      - name: All required release regressions actually ran, no missing/skipped suites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.verify_cleaner_regressions import verify
          for summary in verify(Path('cleaner/build/test-results'), variants=('Release',)):
              print(summary)
          PY
      - name: Exact identity, signer and full merged permission continuity
        run: python3 tools/inspect_liveguard_295_candidate.py
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Same-key 2.94 update, saved data and native settings
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: |
            python3 tools/battery_voice_update_smoke.py cleaner
            python3 tools/liveguard_283_native_smoke.py
            adb shell appops set com.universalrp.cleansweep SYSTEM_ALERT_WINDOW allow
            python3 tools/verify_liveguard_295_installed.py
            bash -o pipefail -c 'python3 tools/run_liveguard_295_native.py 2>&1 | tee "$RUNNER_TEMP/liveguard-native.log"'
      - name: Surface native failures without downloading artifact blobs
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def report(text):
              print('::error title=Live Guard native diagnostic::'+text[:12000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          failures=0
          for p in Path('cleaner/build/outputs/androidTest-results').rglob('*.xml'):
              try: root=ET.parse(p).getroot()
              except ET.ParseError: continue
              for c in root.iter('testcase'):
                  for kind in ('failure','error'):
                      f=c.find(kind)
                      if f is not None:
                          failures+=1
                          report(c.get('classname','')+'.'+c.get('name','')+'\n'+f.get('message','')+'\n'+(f.text or ''))
          log=Path(os.environ['RUNNER_TEMP'],'liveguard-native.log')
          if not failures and log.exists(): report('\n'.join(log.read_text(errors='replace').splitlines()[-100:]))
          PY
      - name: Required native PDF isolation and shared-card tests actually ran
        run: python3 tools/verify_liveguard_295_native.py
      - name: Remove baseline from candidate download
        run: rm "${RUNNER_TEMP}/health-cleaner/CleanSweep-v2.94.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: Live-Guard-2.95-signed-tested-candidate
          path: ${{ runner.temp }}/health-cleaner/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Live-Guard-2.95-regression-failures
          path: |
            cleaner/build/reports/tests/
            cleaner/build/reports/androidTests/
            cleaner/build/outputs/androidTest-results/
            cleaner/build/reports/lint-results-release.html
            ${{ runner.temp }}/health-cleaner/last-native-ui.xml
          retention-days: 7
